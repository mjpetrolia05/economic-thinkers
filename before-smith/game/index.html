<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercantile Manor · Great Economic Thinkers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Creepster&family=Nunito:ital,wght@0,500;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1b0f33; --night2:#2c1850; --purple:#5b2e91; --ink:#1a0f2e;
  --teal:#3fb8a9; --lime:#a6d64a; --orange:#f5892a; --yellow:#ffd23f; --pink:#ff7aa8; --red:#ff5a5a;
  --cream:#fff4dc; --paper:#fffaf0; --muted:#6a5a86; --fog:#c9b8e8;
  --cartoon:"Luckiest Guy","Arial Black",Impact,sans-serif;
  --spooky:"Creepster","Luckiest Guy",Impact,sans-serif;
  --body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0; overflow-x:clip}
body{font-family:var(--body); font-size:15px; line-height:1.5; color:var(--cream); min-height:100vh;
  background:radial-gradient(900px 500px at 85% -5%,rgba(166,214,74,.16),transparent 60%),radial-gradient(800px 600px at 0% 30%,rgba(91,46,145,.55),transparent 65%),linear-gradient(180deg,var(--night),#170b2b);
  background-attachment:fixed}
button{font:inherit; color:inherit; cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:3px solid var(--yellow); outline-offset:3px}
h1,h2,h3,h4{font-family:var(--cartoon); font-weight:400; margin:0; line-height:1.05; letter-spacing:.02em}
p{margin:0 0 .7em}
.app{max-width:1260px; margin:0 auto; padding:14px 16px 50px; display:grid; gap:14px}

/* header */
.top{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px}
.logo{display:flex; align-items:center; gap:10px}
.logo h1{font-size:clamp(22px,3.6vw,36px); color:var(--lime); text-shadow:2px 2px 0 var(--ink),4px 4px 0 var(--purple); transform:rotate(-1deg)}
.logo h1 span{font-family:var(--spooky); color:var(--orange); letter-spacing:.04em}
.logo small{display:block; color:var(--fog); font-weight:700}
.navs{display:flex; flex-wrap:wrap; gap:8px}
.pill{display:inline-flex; align-items:center; gap:6px; font-family:var(--cartoon); font-size:15px; letter-spacing:.04em; text-decoration:none; color:var(--ink); background:var(--teal); padding:8px 14px; border:3px solid var(--ink); border-radius:999px; box-shadow:3px 3px 0 var(--ink); transition:transform .1s, box-shadow .1s}
.pill:hover:not(:disabled){transform:translate(-2px,-2px) rotate(-1deg); box-shadow:5px 5px 0 var(--ink)}
.pill:active:not(:disabled){transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
.pill:disabled{opacity:.4}
.pill.orange{background:var(--orange)} .pill.lime{background:var(--lime)} .pill.yellow{background:var(--yellow)} .pill.pink{background:var(--pink)} .pill.cream{background:var(--cream)} .pill.red{background:var(--red)} .pill.purple{background:var(--purple); color:var(--cream)}
.pill.big{font-size:19px; padding:12px 20px}

/* panels */
.panel{background:var(--paper); color:var(--ink); border:4px solid var(--ink); border-radius:20px; box-shadow:6px 6px 0 var(--c,var(--orange)); padding:14px 16px; min-width:0}
.panel h3{font-size:20px; color:var(--purple); margin-bottom:8px}
.panel.teal{--c:var(--teal)} .panel.lime{--c:var(--lime)} .panel.pink{--c:var(--pink)} .panel.yellow{--c:var(--yellow)} .panel.purple{--c:var(--purple)}

/* HUD */
.hud{display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; justify-content:space-between}
.clock{display:flex; align-items:center; gap:10px}
.clock .t{font-family:var(--cartoon); font-size:28px; color:var(--purple)}
.clock .r{font-weight:800; color:var(--muted); font-size:13px}
.dawn{flex:1; min-width:160px; height:16px; border:3px solid var(--ink); border-radius:999px; background:linear-gradient(90deg,#2c1850,#5b2e91 60%,#ff9a5a 90%,#ffd23f); position:relative; overflow:hidden}
.dawn i{position:absolute; top:0; bottom:0; right:0; background:#1a0f2ecc; transition:width .5s}
.crewbar{display:flex; gap:6px; align-items:flex-end}
.cm{display:grid; justify-items:center; font-size:11px; font-weight:800; position:relative}
.cm.out{opacity:.35; filter:grayscale(1)}
.cm .flag{position:absolute; top:-6px; right:-8px; font-size:14px}

/* main layout */
.main{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:14px; align-items:start}
.map{display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:auto auto auto; gap:8px; background:#120828; border:4px solid var(--ink); border-radius:20px; padding:10px; box-shadow:6px 6px 0 var(--lime)}
.room{position:relative; min-height:128px; border:3px solid var(--ink); border-radius:14px; padding:8px; text-align:left; color:var(--ink); background:var(--rc); display:flex; flex-direction:column; gap:4px; overflow:hidden; transition:transform .15s, box-shadow .15s}
.room.hall{grid-column:1 / -1; min-height:96px; background:linear-gradient(90deg,#e9dcff,#f6efff,#e9dcff)}
.room .rn{font-family:var(--cartoon); font-size:15px; line-height:1.1}
.room .wing{font-size:10px; font-weight:800; letter-spacing:.08em; background:var(--ink); color:var(--cream); border-radius:6px; padding:1px 6px; align-self:flex-start}
.room .occ{display:flex; flex-wrap:wrap; gap:2px; align-items:flex-end; margin-top:auto}
.room .zz{position:absolute; top:6px; right:6px; display:flex; gap:2px}
.room.here{box-shadow:0 0 0 4px var(--yellow), 0 0 22px var(--yellow)}
.room.can{cursor:pointer}
.room.can:hover{transform:translateY(-3px) rotate(-.6deg)}
.room.can::after{content:"MOVE HERE"; position:absolute; bottom:6px; right:8px; font-family:var(--cartoon); font-size:11px; color:var(--ink); opacity:.55}
.room.dark::before{content:"?"; position:absolute; inset:0; display:grid; place-items:center; background:repeating-linear-gradient(45deg,#1b0f33ee 0 8px,#22123fee 8px 16px); color:var(--fog); font-family:var(--spooky); font-size:40px; z-index:2}
.room.dark .rn{position:relative; z-index:3; color:var(--cream)}
.room.dark .wing{position:relative; z-index:3}

/* side */
.side{display:grid; gap:14px}
.actions{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
.act{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:10px 12px; border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink); box-shadow:3px 3px 0 var(--ink); transition:transform .1s}
.act b{font-family:var(--cartoon); font-weight:400; font-size:16px; letter-spacing:.02em}
.act small{font-weight:700; color:var(--muted); line-height:1.3}
.act:hover:not(:disabled){transform:translate(-2px,-2px)}
.act:disabled{opacity:.4; box-shadow:none}
.status{font-weight:800; margin:8px 0 0; color:var(--purple)}
.hand{display:flex; flex-wrap:wrap; gap:8px; min-height:96px}
.acard{width:78px; height:100px; border:3px solid var(--ink); border-radius:12px; background:var(--cream); display:grid; justify-items:center; align-content:center; gap:2px; box-shadow:3px 3px 0 var(--cc); text-align:center; transition:transform .15s}
.acard .i{font-size:30px; line-height:1}
.acard .n{font-family:var(--cartoon); font-size:12px; color:var(--ink)}
.acard.new{animation:deal .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes deal{from{transform:translateY(-30px) rotate(-20deg); opacity:0}}
.empty{color:var(--muted); font-weight:700}

/* notebook */
.notebook{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.nbcol h4{font-size:15px; padding:6px 8px; border:3px solid var(--ink); border-radius:10px 10px 0 0; background:var(--qc); color:var(--ink)}
.nbcol .left{font-family:var(--body); font-size:11px; font-weight:800}
.nbrow{display:flex; justify-content:space-between; gap:6px; align-items:center; width:100%; text-align:left; padding:6px 8px; border:3px solid var(--ink); border-top:0; background:#fff; color:var(--ink); font-weight:800; font-size:14px}
.nbrow:last-child{border-radius:0 0 10px 10px}
.nbrow .mk{font-family:var(--cartoon); font-size:13px; min-width:28px; text-align:right}
.nbrow.seen{background:#ece6f5; color:#9a8fb0; text-decoration:line-through; text-decoration-thickness:2px}
.nbrow.seen .mk{text-decoration:none; color:var(--purple)}
.nbrow.x .mk{color:var(--red)} .nbrow.q .mk{color:var(--orange)} .nbrow.star{background:#fff4c4} .nbrow.star .mk{color:#b07c00}
.log{display:grid; gap:4px; max-height:220px; overflow:auto; font-size:14px}
.log div{padding:5px 8px; border-radius:8px; background:#f3ecff}
.log div:first-child{background:#fff1c9; font-weight:700}
.log .bad{background:#ffe0e0}

/* overlay */
.overlay{position:fixed; inset:0; z-index:60; background:rgba(18,8,40,.86); display:grid; place-items:center; padding:16px; overflow:auto}
.overlay[hidden]{display:none}
.modal{width:min(820px,100%); min-width:0; overflow-wrap:anywhere; background:var(--paper); color:var(--ink); border:4px solid var(--ink); border-radius:24px; box-shadow:8px 8px 0 var(--lime); padding:22px; animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) rotate(-2deg); opacity:0}}
.modal h2{font-size:clamp(24px,4vw,36px); color:var(--purple); text-shadow:2px 2px 0 var(--lime); margin-bottom:8px}
.modal .sub{font-weight:700; color:var(--muted)}
.modal .foot{display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end; margin-top:16px}
.pick{display:grid; gap:12px; margin-top:10px}
.pickrow h4{font-size:15px; margin-bottom:6px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:3px solid var(--ink); border-radius:999px; padding:6px 12px; background:#fff; color:var(--ink); font-weight:800; font-size:14px}
.chip.seen{color:#9a8fb0; text-decoration:line-through}
.chip[aria-pressed="true"]{background:var(--qc); transform:translateY(-2px); box-shadow:2px 2px 0 var(--ink)}
.opts{display:grid; gap:8px; margin-top:12px}
.opt{text-align:left; padding:12px 14px; border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink); font-weight:800; font-size:16px}
.opt:hover:not(:disabled){background:#f3ecff}
.opt.right{background:#e4f7c8} .opt.wrong{background:#ffd9d9}
.transcript{display:grid; gap:8px; margin-top:10px}
.say{display:flex; gap:10px; align-items:center; padding:8px 10px; border:3px solid var(--ink); border-radius:14px; background:#fff; opacity:0; transform:translateX(-12px); transition:all .3s}
.say.in{opacity:1; transform:none}
.say .bub{font-weight:700}
.reveal-card{display:inline-block; padding:4px 10px; border:3px solid var(--ink); border-radius:10px; background:var(--qc); font-family:var(--cartoon); font-size:15px}
.cardbig{border:4px solid var(--ink); border-radius:16px; background:var(--qc); padding:12px 14px; box-shadow:4px 4px 0 var(--ink); margin:10px 0}
.cardbig .q{font-family:var(--cartoon); font-size:12px; letter-spacing:.08em}
.cardbig .n{font-family:var(--cartoon); font-size:24px}
.votes{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:10px}
.vote{display:flex; gap:10px; align-items:center; text-align:left; padding:8px 10px; border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink)}
.vote .claim{font-weight:700; font-size:14px}
.vote[aria-pressed="true"]{background:var(--yellow)}
.space{position:relative; height:150px; border-radius:16px; overflow:hidden; background:radial-gradient(#fff 1px,transparent 1.5px) 0 0/22px 22px,linear-gradient(180deg,#0b0420,#1b0f33); border:3px solid var(--ink)}
.space .floater{position:absolute; top:40px; left:-60px; animation:float 3.2s linear forwards}
@keyframes float{to{left:110%; transform:rotate(540deg)}}
.space .msg{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--cartoon); font-size:clamp(18px,3vw,26px); color:var(--cream); text-align:center; padding:10px; opacity:0; animation:msg .6s 1.4s forwards}
@keyframes msg{to{opacity:1}}
.unmask{display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center}
.sheetwrap{position:relative; width:150px; height:170px}
.sheetwrap .under{position:absolute; inset:20px 10px 0; border:4px solid var(--ink); border-radius:50% 50% 18px 18px; background:var(--cream); display:grid; place-items:center; font-size:56px}
.sheetwrap .sheet{position:absolute; inset:0; animation:lift 1.4s .4s cubic-bezier(.5,-.3,.4,1) forwards}
@keyframes lift{to{transform:translateY(-140px) rotate(-25deg); opacity:0}}
.howto{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:12px 0}
.howto div{border:3px solid var(--ink); border-radius:14px; padding:10px; background:#fff}
.howto b{font-family:var(--cartoon); font-weight:400; font-size:16px; display:block; color:var(--purple)}

/* previous / next case tabs */
.casenav{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px}
.cn{display:flex; flex-direction:column; gap:2px; text-decoration:none; color:var(--ink); background:var(--cream); border:4px solid var(--ink); border-radius:20px 20px 20px 6px; padding:12px 16px; box-shadow:5px 5px 0 var(--orange); transition:transform .15s}
.cn.next{text-align:right; border-radius:20px 20px 6px 20px; background:var(--lime); box-shadow:5px 5px 0 var(--purple)}
.cn:hover{transform:translateY(-3px) rotate(-1deg)}
.cn .d{font-weight:800; font-size:12px; letter-spacing:.1em; color:var(--muted)}
.cn.next .d{color:var(--ink)}
.cn .t{font-family:var(--cartoon); font-size:clamp(16px,2.2vw,22px)}
@media (max-width:560px){ .casenav{grid-template-columns:1fr} .cn.next{text-align:left} }
@media (max-width:960px){ .main{grid-template-columns:1fr} }
@media (max-width:640px){
  .notebook{grid-template-columns:1fr}
  .actions{grid-template-columns:1fr}
  .howto{grid-template-columns:1fr}
  .votes{grid-template-columns:1fr}
  .room{min-height:110px}
  .room .rn{font-size:13px; padding-right:16px}
  .room.can::after{content:"▸"; font-size:16px}
  .room .zz{top:4px; right:4px; flex-direction:column; gap:0}
  .room .zz svg{width:14px; height:16px}
  .room .wing{font-size:9px}
  .unmask{grid-template-columns:1fr; justify-items:center}
}
@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><span id="logoBean"></span>
      <div><h1>The Haunting of <span>Mercantile Manor</span></h1><small>Case 001 · Ideas in Action · what · how · share</small></div></div>
    <nav class="navs">
      <button class="pill yellow" type="button" data-act="help">? How to play</button>
      <a class="pill cream" href="../">← Case 001 ideas</a>
      <a class="pill cream" href="../../">⌂ Home</a>
    </nav>
  </header>
  <div class="panel hud purple" id="hud"></div>
  <div class="main">
    <div>
      <div class="map" id="map" aria-label="Map of the manor"></div>
    </div>
    <div class="side">
      <div class="panel orange" id="roomPanel"></div>
      <div class="panel teal"><h3>Your cards</h3><div class="hand" id="hand"></div></div>
    </div>
  </div>
  <div class="panel lime"><h3>Detective notebook <span style="font-family:var(--body);font-size:13px;color:var(--muted)">· tap a card to mark ✗ / ? / ★</span></h3><div class="notebook" id="notebook"></div></div>
  <div class="panel pink"><h3>Case log</h3><div class="log" id="log"></div></div>
  <nav class="casenav" aria-label="Case files">
    <a class="cn" href="../../"><span class="d">◀ ALL CASE FILES</span><span class="t">⌂ Home</span></a>
    <a class="cn next" href="../../smith/"><span class="d">NEXT CASE ▶</span><span class="t">Case 002 · Adam Smith</span></a>
  </nav>
</div>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>

<script>
/* =====================================================================
   THE HAUNTING OF MERCANTILE MANOR
   CLUE:            a ghost hides behind one WHAT, one HOW, one SHARE card.
   AMONG US:        one crewmate is the Impostor: lies, scares, sabotages.
   SLEEPING QUEENS: some clues sleep face-down in rooms; wake them with
                    action cards earned by doing three-question tasks.
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const COL = {teal:"#3fb8a9", lime:"#a6d64a", orange:"#f5892a", yellow:"#ffd23f", pink:"#ff7aa8", purple:"#5b2e91", ink:"#1a0f2e", cream:"#fff4dc", red:"#ff5a5a"};
const QC = {w:COL.orange, h:COL.teal, s:COL.pink};
const QN = {w:"WHAT", h:"HOW", s:"SHARE"};
const QL = {w:"What will we make?", h:"How will we make it?", s:"How will we share it?"};
const ROUNDS = 16;

/* ---------- the clue cards: one category per economic question ---------- */
const CARDS = {
  w0:{q:"w", n:"Exports", d:"Sell abroad more than you buy. Money flows in and people get work. (Mercantilists)"},
  w1:{q:"w", n:"Luxuries", d:"Vanity and fashion keep the hive busy. (Mandeville)"},
  w2:{q:"w", n:"Grain", d:"Only farming yields a true surplus, nature's gift. (The Physiocrats)"},
  w3:{q:"w", n:"Whatever Sells", d:"The market is the best judge of value. (Barbon)"},
  w4:{q:"w", n:"Woolens for Work", d:"Build up industries to end unemployment. (The Tudor state)"},
  h0:{q:"h", n:"Royal Monopoly", d:"Charters and patents keep rival merchants out."},
  h1:{q:"h", n:"Buy Low, Sell High", d:"Profit from the price gap between regions."},
  h2:{q:"h", n:"Putting-Out", d:"Merchants hand raw materials to cottage workers."},
  h3:{q:"h", n:"Free Competition", d:"Scrap the privileges and let self-interest compete. (North)"},
  h4:{q:"h", n:"Wage Labor", d:"Workers without tools sell their labor to employers."},
  s0:{q:"s", n:"Merchants & Lords", d:"Lords take the surplus; merchants take a share through trade.", ben:"Merchant capital", e:"🪙"},
  s1:{q:"s", n:"The Poor Rate", d:"The parish taxes the better-off to relieve the poor.", ben:"The paternal Crown", e:"👑"},
  s2:{q:"s", n:"Rent to Landlords", d:"The surplus flows to the idle class as rent. (Quesnay)", ben:"The landlords", e:"🏰"},
  s3:{q:"s", n:"Profit After Wages", d:"Profit is whatever is left after workers' needs.", ben:"The producer-capitalists", e:"🏭"},
  s4:{q:"s", n:"Maximum Wage", d:"Justices cap what workers may be paid. (1563)", ben:"The employers on the bench", e:"⚖️"}
};
const IDS = Object.keys(CARDS);
const SUSPECTS = [
  {n:"Nicholas Barbon", c:["w3","h1","s0"]}, {n:"the Tudor Crown", c:["w4","h0","s1"]},
  {n:"Sir Dudley North", c:["w3","h3","s3"]}, {n:"Bernard Mandeville", c:["w1","h3","s3"]},
  {n:"François Quesnay", c:["w2","h3","s2"]}, {n:"Defoe and the labor writers", c:["w4","h4","s3"]}
];

/* ---------- the manor ---------- */
const ROOMS = {
  ball:{n:"Ballroom", q:"w", i:"💃", c:"#ffd9b0"}, count:{n:"Counting House", q:"w", i:"🪙", c:"#ffe3c4"},
  study:{n:"Landlord's Study", q:"s", i:"📜", c:"#ffd4e4"}, hall:{n:"Great Hall", q:null, i:"🕯️", c:"#efe6ff"},
  docks:{n:"Docks", q:"h", i:"⚓", c:"#c9f0ea"}, work:{n:"Workshop", q:"h", i:"🧵", c:"#d8f5ef"},
  vestry:{n:"Parish Vestry", q:"s", i:"⛪", c:"#ffe0ec"}
};
const ORDER = ["ball","count","study","hall","docks","work","vestry"];
const ADJ = {ball:["count","docks","hall"], count:["ball","study","hall"], study:["count","vestry","hall"], vestry:["study","work","hall"], work:["vestry","docks","hall"], docks:["work","ball","hall"], hall:["ball","count","study","vestry","work","docks"]};

/* ---------- action cards (the Sleeping Queens hand) ---------- */
const ACARDS = {
  key:{n:"KEY", i:"🗝️", c:COL.yellow, d:"Wake a sleeping clue in this room."},
  lantern:{n:"LANTERN", i:"🔦", c:COL.orange, d:"Wake a sleeping clue in ANY room."},
  trap:{n:"GHOST TRAP", i:"🪤", c:COL.teal, d:"Make a crewmate show you one of their clues. Liars get caught!"},
  garlic:{n:"GARLIC", i:"🧄", c:COL.lime, d:"Kept in your pocket, it blocks the next sabotage."}
};

/* ---------- tasks: one bank per question ---------- */
const TASKS = {
  w:[
    ["A merchant floods the market with silk. Barbon says its price will…", ["Fall", "Rise", "Stay the same"], "Plenty makes things cheap; scarcity makes them dear."],
    ["A broken bucket is good for nothing. Its value, says Barbon, is…", ["Nothing", "The labor that made it", "Whatever the guild decides"], "Things of no use have no value."],
    ["Mercantilists wanted exports to exceed imports mainly to…", ["Bring in money and create jobs", "Lower prices at home", "Cut taxes for the poor"], "Full employment was the thread running through mercantilist policy."],
    ["In Mandeville's fable, when the hive turns honest…", ["Trade collapses", "The hive grows richer", "Nothing changes"], "Private vices, public benefits."],
    ["The Physiocrats said a true surplus comes only from…", ["Farming", "Manufacturing", "Foreign trade"], "Manufacturing was 'sterile' to them: it only replaced its own costs."],

    ["Little Tom, 6, is orphaned. Under the 1601 law he is…", ["Boarded out", "Set to work", "Sent to prison"], "Children too young to apprentice were boarded out."],
    ["The Statute of Artificers (1563) set…", ["Maximum wages", "Minimum wages", "No wages at all"], "The caps protected employers, who sat as the justices who set them."],

/* ---------- sprites ---------- */

function ghostSvg(size = 22, sleeping = true, col = "#fff"){

const CREW = [
  {id:0, name:"Ruby", col:"#ff5a5a"}, {id:1, name:"Teo", col:"#3fb8a9"},
  {id:2, name:"Juno", col:"#a6d64a"}, {id:3, name:"Pip", col:"#ff7aa8"}
];

/* ---------- state ---------- */
let S = null;
function newGame(){
  const env = {w:pick(IDS.filter(k => k[0] === "w")), h:pick(IDS.filter(k => k[0] === "h")), s:pick(IDS.filter(k => k[0] === "s"))};
  const rest = shuffle(IDS.filter(k => !Object.values(env).includes(k)));
  const imp = Math.floor(Math.random() * 4);
  const crew = CREW.map((c, i) => ({...c, cards:rest.slice(i * 2, i * 2 + 2), status:"in", impostor:i === imp, room:"hall", caught:false}));
  const sleep = {}; ORDER.forEach(r => sleep[r] = []);
  rest.slice(8).forEach(k => sleep[pick(ORDER.filter(r => r !== "hall"))].push(k));
  S = {round:0, room:"hall", moved:false, acted:false, env, crew, sleep, hand:["key","key","trap"], newCard:null,
       seen:{}, marks:{}, log:[], lies:[], cool:4, spooks:0, lights:false, meetingUsed:false, over:null, tasks:0, impOut:false, used:{w:[], h:[], s:[]}};
  logm("You and the gang arrive at Mercantile Manor. Somewhere inside, a ghost hides behind a theory of profit.");
  logm("One of your crewmates is secretly the IMPOSTOR. Trust carefully.");
  hideModal(); render();
}
function logm(t, cls = ""){ S.log.unshift({t:`${clock(S.round)} · ${t}`, cls}); S.log = S.log.slice(0, 60); }
function clock(r){ const h = (16 + r) % 24; return `${h % 12 || 12}${h < 12 ? " AM" : " PM"}`; }
const active = () => S.crew.filter(c => c.status === "in");
const innocents = () => active().filter(c => !c.impostor);
function visible(room){ return room === S.room || (!S.lights && ADJ[S.room].includes(room)); }
function see(id, src){ if (!S.seen[id]) S.seen[id] = src; }

/* ---------- rendering ---------- */
function render(){
  renderHud(); renderMap(); renderRoom(); renderHand(); renderNotebook(); renderLog();
}
function renderHud(){
  const pct = S.round / ROUNDS * 100;
  $("#hud").innerHTML = `
    <div class="clock"><span class="t">${clock(S.round)}</span><span class="r">hour ${Math.min(S.round + 1, ROUNDS)} of ${ROUNDS}<br>the ghost flees at dawn</span></div>
    <div class="dawn" title="Time until dawn"><i style="width:${100 - pct}%"></i></div>
    <div class="crewbar">${S.crew.map(c => `<div class="cm ${c.status !== "in" ? "out" : ""}" title="${c.name}: ${c.status === "in" ? "on the case" : c.status}">${bean(c.col, 26, {x:c.status === "spooked"})}${c.name}${c.caught ? `<span class="flag" title="Caught lying">⚠️</span>` : ""}</div>`).join("")}</div>
    <div class="navs"><button class="pill red" type="button" data-act="meeting" ${S.meetingUsed || S.over ? "disabled" : ""}>🚨 Emergency meeting</button><button class="pill orange" type="button" data-act="accuse" ${S.over ? "disabled" : ""}>🎭 Unmask the ghost</button></div>`;
}
function renderMap(){
  $("#map").innerHTML = ORDER.map(r => {
    const R = ROOMS[r], here = S.room === r, vis = visible(r);
    const can = !S.moved && !S.acted && !S.played && !S.over && ADJ[S.room].includes(r);
    const people = vis ? S.crew.filter(c => c.status === "in" && c.room === r) : [];
    const zz = S.sleep[r].length;
    return `<div class="room ${r === "hall" ? "hall" : ""} ${here ? "here" : ""} ${can ? "can" : ""} ${vis ? "" : "dark"}" style="--rc:${R.c}" ${can ? `data-act="move" data-arg="${r}" role="button" tabindex="0" aria-label="Move to ${R.n}"` : ""}>
      <span class="rn">${R.i} ${R.n}</span>
      ${R.q ? `<span class="wing" style="background:${QC[R.q]};color:${COL.ink}">${QN[R.q]} WING</span>` : `<span class="wing">MEETINGS · ACCUSATIONS</span>`}
      ${zz && vis ? `<span class="zz" title="${zz} sleeping clue${zz > 1 ? "s" : ""}">${Array.from({length:zz}, () => ghostSvg(20)).join("")}</span>` : ""}
      <div class="occ">${here ? bean(COL.yellow, 30, {hat:true}) : ""}${people.map(c => `<span title="${c.name}">${bean(c.col, 24)}</span>`).join("")}</div>
    </div>`;
  }).join("");
}
function renderRoom(){
  const R = ROOMS[S.room], zz = S.sleep[S.room].length, has = k => S.hand.includes(k);
  const anySleep = ORDER.some(r => S.sleep[r].length);
  const btn = (act, title, sub, ok, used) => `<button class="act" type="button" data-act="${act}" ${ok && !used && !S.over ? "" : "disabled"}><b>${title}</b><small>${sub}</small></button>`;
  const both = S.acted && S.played;
  $("#roomPanel").innerHTML = `
    <h3>${R.i} ${R.n}${R.q ? ` <span style="font-size:13px;color:${QC[R.q]}">· ${QL[R.q]}</span>` : ""}</h3>
    <div style="font-family:var(--cartoon);font-size:13px;color:var(--muted);margin:2px 0 6px">MAIN ACTION ${S.acted ? "✔" : "· pick one"}</div>
    <div class="actions">
      ${R.q ? btn("task", `📝 Do a ${QN[R.q]} task`, "Answer right to earn an action card.", true, S.acted) : btn("task", "📝 No tasks here", "Tasks are in the wings.", false, S.acted)}
      ${btn("suggest", "🔍 Make a suggestion", "Name a WHAT, HOW & SHARE. The gang tries to disprove it.", true, S.acted)}
    </div>
    <div style="font-family:var(--cartoon);font-size:13px;color:var(--muted);margin:10px 0 6px">PLAY A CARD ${S.played ? "✔" : "· free, one per hour"}</div>
    <div class="actions">
      ${btn("wake", "🗝️ Wake a sleeping clue", zz ? `${zz} asleep here. Uses a KEY.` : "No sleeping clues here.", zz && has("key"), S.played)}
      ${btn("lantern", "🔦 Lantern", anySleep ? "Wake a clue in any room." : "No clues asleep anywhere.", anySleep && has("lantern"), S.played)}
      ${btn("trap", "🪤 Ghost trap", "Force a crewmate to show a clue.", has("trap") && active().some(c => c.cards.some(k => !S.seen[k])), S.played)}
      <button class="act" type="button" data-act="end" ${S.over ? "disabled" : ""} style="background:${both ? COL.lime : "#fff"}"><b>⏭️ End turn</b><small>${both ? "Night falls a little deeper…" : "Wait out the hour."}</small></button>
    </div>
    <p class="status">${S.over ? "The case is over." : both ? "All done this hour. End your turn." : S.moved || S.acted || S.played ? "Take your main action and/or play a card, then end your turn." : "Move to a neighboring room (click it), then act."}${S.lights ? " 🌑 The lights are out!" : ""}</p>`;
}
function renderHand(){
  $("#hand").innerHTML = S.hand.length ? S.hand.map((k, i) => `<div class="acard ${S.newCard === i ? "new" : ""}" style="--cc:${ACARDS[k].c}" title="${ACARDS[k].d}"><span class="i">${ACARDS[k].i}</span><span class="n">${ACARDS[k].n}</span></div>`).join("") + `<span class="empty" style="align-self:center">${S.hand.length}/5 · hover for details</span>`
    : `<span class="empty">No cards. Do tasks in the WHAT, HOW, and SHARE wings to earn some.</span>`;
  S.newCard = null;
}
function renderNotebook(){
  $("#notebook").innerHTML = ["w","h","s"].map(q => {
    const ids = IDS.filter(k => k[0] === q), left = ids.filter(k => !S.seen[k]).length;
    return `<div class="nbcol"><h4 style="--qc:${QC[q]}">${QN[q]} <span class="left">· ${QL[q]} · ${left} left</span></h4>
      ${ids.map(k => { const seen = S.seen[k], m = S.marks[k];
        return `<button class="nbrow ${seen ? "seen" : m === "x" ? "x" : m === "q" ? "q" : m === "star" ? "star" : ""}" type="button" data-act="mark" data-arg="${k}" title="${CARDS[k].d}">
          <span>${CARDS[k].n}</span><span class="mk">${seen ? seen : m === "x" ? "✗" : m === "q" ? "?" : m === "star" ? "★" : ""}</span></button>`; }).join("")}

}
function renderLog(){ $("#log").innerHTML = S.log.map(l => `<div class="${l.cls}">${l.t}</div>`).join(""); }

/* ---------- modal helpers ---------- */
function showModal(html, accent){ $("#modal").innerHTML = html; $("#modal").style.boxShadow = `8px 8px 0 ${accent || COL.lime}`; $("#overlay").hidden = false; }
function hideModal(){ $("#overlay").hidden = true; }
const cardChip = k => `<span class="reveal-card" style="--qc:${QC[k[0]]}">${CARDS[k].n}</span>`;
const bigCard = k => `<div class="cardbig" style="--qc:${QC[k[0]]}"><div class="q">${QN[k[0]]} · ${QL[k[0]]}</div><div class="n">${CARDS[k].n}</div><div style="font-weight:700">${CARDS[k].d}</div></div>`;

/* ---------- actions ---------- */
function move(r){ if (S.moved || S.acted || S.played || !ADJ[S.room].includes(r)) return; S.room = r; S.moved = true; render(); }
function gainCard(){
  if (S.hand.length >= 5) return null;
  const k = pick(["key","key","key","trap","trap","lantern","garlic"]);
  S.hand.push(k); S.newCard = S.hand.length - 1; return k;
}
function useCard(k){ const i = S.hand.indexOf(k); if (i >= 0) S.hand.splice(i, 1); }

function task(){
  const q = ROOMS[S.room].q; if (!q) return;
  let pool = TASKS[q].map((_, i) => i).filter(i => !S.used[q].includes(i));
  if (!pool.length){ S.used[q] = []; pool = TASKS[q].map((_, i) => i); }
  const i = pick(pool); S.used[q].push(i);
  const [ques, opts, why] = TASKS[q][i];
  const order = shuffle(opts.map((o, j) => j));
  showModal(`<span class="reveal-card" style="--qc:${QC[q]}">${QN[q]} TASK · ${ROOMS[S.room].n}</span>
    <h2 style="margin-top:10px">${ques}</h2>
    <div class="opts">${order.map(j => `<button class="opt" type="button" data-act="answer" data-arg="${j}">${opts[j]}</button>`).join("")}</div>
    <div id="taskOut"></div>`, QC[q]);
  S._task = {q, why};
}
function answer(j, el){
  const ok = +j === 0;
  $$(".opt").forEach(b => { b.disabled = true; if (b.dataset.arg === "0") b.classList.add("right"); });
  if (!ok) el.classList.add("wrong");
  S.acted = true;
  let msg;
  if (ok){ S.tasks++; const k = gainCard(); msg = k ? `✔ Task complete! You earned a <b>${ACARDS[k].i} ${ACARDS[k].n}</b> card.` : "✔ Task complete! (Your hand is full.)"; logm(`Task done in the ${ROOMS[S.room].n}${k ? `: earned a ${ACARDS[k].n}` : ""}.`); }
  else { msg = "✘ Not quite. No card this time."; logm(`Task failed in the ${ROOMS[S.room].n}.`, "bad"); }
  $("#taskOut").innerHTML = `<p style="margin-top:12px;font-weight:800">${msg}</p><p class="sub">${S._task.why}</p><div class="foot"><button class="pill lime" type="button" data-act="close">Back to the manor</button></div>`;
  render();
}
function wake(where){
  const r = where || S.room; if (!S.sleep[r].length) return;
  useCard(where ? "lantern" : "key");
  const k = S.sleep[r].shift(); see(k, "woke");
  S.played = true;
  logm(`You woke a sleeping ghost in the ${ROOMS[r].n}: it was holding <b>${CARDS[k].n}</b>.`);
  showModal(`<div style="display:flex;gap:12px;align-items:center">${ghostSvg(70, false)}<h2>The ghost wakes up and drops a clue!</h2></div>${bigCard(k)}<p class="sub">This card is NOT in the ghost's disguise. Crossed off your notebook.</p><div class="foot"><button class="pill lime" type="button" data-act="close">Nice!</button></div>`, QC[k[0]]);
  render();
}
function lanternPick(){
  const rooms = ORDER.filter(r => S.sleep[r].length);
  showModal(`<h2>🔦 Shine the lantern where?</h2><p class="sub">Pick a room with sleeping clues.</p><div class="opts">${rooms.map(r => `<button class="opt" type="button" data-act="lanternRoom" data-arg="${r}">${ROOMS[r].i} ${ROOMS[r].n} · ${S.sleep[r].length} asleep</button>`).join("")}</div><div class="foot"><button class="pill cream" type="button" data-act="close">Cancel</button></div>`, COL.orange);
}
function trapPick(){
  showModal(`<h2>🪤 Set the ghost trap on…</h2><p class="sub">They must show you a clue you haven't seen. If they lied to you before, you'll catch them.</p>
    <div class="votes">${active().map(c => `<button class="vote" type="button" data-act="trapOn" data-arg="${c.id}">${bean(c.col, 30)}<b style="font-family:var(--cartoon);font-weight:400;font-size:18px">${c.name}</b></button>`).join("")}</div>
    <div class="foot"><button class="pill cream" type="button" data-act="close">Cancel</button></div>`, COL.teal);
}
function trapOn(id){
  const c = S.crew[id]; const fresh = c.cards.filter(k => !S.seen[k]);
  useCard("trap"); S.played = true;
  let html;
  if (!fresh.length){ html = `<h2>${c.name} has nothing new</h2><p class="sub">You've already seen everything ${c.name} holds.</p>`; logm(`Ghost trap on ${c.name}: nothing new.`); }
  else {
    const k = pick(fresh); see(k, c.name);
    const lie = S.lies.find(l => l.id === id && l.cards.includes(k));
    if (lie){ c.caught = true; }
    html = `<div style="display:flex;gap:12px;align-items:center">${bean(c.col, 56)}<h2>The trap snaps! ${c.name} shows…</h2></div>${bigCard(k)}
      ${lie ? `<p style="font-weight:800;color:${COL.red};font-size:18px">⚠️ CAUGHT LYING! Earlier, ${c.name} said they couldn't help with a suggestion that included ${CARDS[k].n}. Only the Impostor lies…</p>` : ""}`;
    logm(`Ghost trap: ${c.name} showed <b>${CARDS[k].n}</b>.${lie ? " ⚠️ CAUGHT LYING!" : ""}`, lie ? "bad" : "");
  }
  showModal(html + `<div class="foot"><button class="pill lime" type="button" data-act="close">Continue</button></div>`, COL.teal);
  render();
}

/* suggestion (Clue) */
let pickSel = {};
function picker(kind){
  pickSel = {};
  const title = kind === "accuse" ? "🎭 Unmask the ghost" : "🔍 Make a suggestion";
  const sub = kind === "accuse" ? "Name the ghost's whole disguise. Get all three right and you crack the case. Get any wrong and the ghost escapes for good!" : "Pick one card from each question. Your crewmates will try to disprove it by showing you one.";
  showModal(`<h2>${title}</h2><p class="sub">${sub}</p><div class="pick">
    ${["w","h","s"].map(q => `<div class="pickrow"><h4 style="color:${q === "w" ? "#b35a00" : q === "h" ? "#167a6e" : "#c2306a"}">${QN[q]} · ${QL[q]}</h4><div class="chips">${IDS.filter(k => k[0] === q).map(k => `<button class="chip ${S.seen[k] ? "seen" : ""}" type="button" style="--qc:${QC[q]}" data-act="pickC" data-arg="${k}" aria-pressed="false">${CARDS[k].n}</button>`).join("")}</div></div>`).join("")}
    </div><div class="foot"><button class="pill cream" type="button" data-act="close">Cancel</button><button class="pill ${kind === "accuse" ? "red" : "orange"} big" type="button" id="goPick" data-act="${kind === "accuse" ? "doAccuse" : "doSuggest"}" disabled>${kind === "accuse" ? "Pull off the mask!" : "Ask the gang"}</button></div>`, kind === "accuse" ? COL.red : COL.orange);
}
function pickC(k){
  pickSel[k[0]] = k;
  $$(`[data-act="pickC"]`).forEach(b => { if (b.dataset.arg[0] === k[0]) b.setAttribute("aria-pressed", b.dataset.arg === k); });
  $("#goPick").disabled = !(pickSel.w && pickSel.h && pickSel.s);
}
function doSuggest(){
  const sug = [pickSel.w, pickSel.h, pickSel.s];
  S.acted = true;
  const lines = [], shown = [];
  for (const c of active()){
    const match = c.cards.filter(k => sug.includes(k));
    if (!match.length){ lines.push({c, t:"Can't help, I don't have any of those."}); continue; }
    if (c.impostor && Math.random() < .55){ lines.push({c, t:"Hmm… nope, can't help, sorry!"}); S.lies.push({id:c.id, cards:match}); continue; }
    const fresh = match.filter(k => !S.seen[k]); const k = pick(fresh.length ? fresh : match);
    shown.push({c, k}); see(k, c.name);
    lines.push({c, t:`I can disprove that! Psst, here: `, k});
  }
  logm(`You suggested ${sug.map(k => CARDS[k].n).join(" · ")}. ${shown.length ? shown.map(s => `${s.c.name} showed <b>${CARDS[s.k].n}</b>`).join("; ") + "." : "Nobody could disprove it!"} ${lines.filter(l => !l.k).map(l => l.c.name).join(", ")}${lines.some(l => !l.k) ? " couldn't help." : ""}`);
  showModal(`<h2>🔍 ${sug.map(k => cardChip(k)).join(" ")}</h2>
    <div class="transcript">${lines.map(l => `<div class="say">${bean(l.c.col, 30)}<span class="bub"><b>${l.c.name}:</b> ${l.t}${l.k ? cardChip(l.k) : ""}</span></div>`).join("")}</div>
    ${shown.length ? "" : `<p style="font-weight:800;margin-top:12px">Nobody could disprove it. Either these cards really are the ghost's disguise, or one is asleep in a room… or someone just lied.</p>`}
    <div class="foot"><button class="pill lime" type="button" data-act="close">Write it down</button></div>`, COL.orange);
  $$(".say").forEach((el, i) => setTimeout(() => el.classList.add("in"), 250 + i * 450));
  render();
}

/* ---------- end of turn: the gang moves, the Impostor acts ---------- */
function endTurn(){
  if (S.over) return;
  S.lights = false;
  active().forEach(c => { if (Math.random() < .65) c.room = pick(ADJ[c.room]); });
  let report = null;
  const imp = S.crew.find(c => c.impostor);
  if (imp.status === "in"){
    S.cool--;
    const targets = innocents().filter(v => v.room !== "hall" && !visible(v.room) && v.room !== S.room && innocents().filter(o => o.room === v.room).length === 1);
    if (S.cool <= 0 && S.spooks < 2 && targets.length){
      const v = pick(targets); imp.room = v.room; v.status = "spooked";
      S.sleep[v.room].push(...v.cards); v.cards = [];
      S.cool = 4; S.spooks++;
      const witnesses = innocents().filter(o => ADJ[v.room].includes(o.room) && Math.random() < .6);
      report = {v, room:v.room, witnesses:witnesses.map(o => o.id)};
      logm(`👻 ${v.name} was found spooked in the ${ROOMS[v.room].n}! Their clues scattered into sleeping ghosts.`, "bad");
    } else if (Math.random() < .55){
      if (S.hand.includes("garlic")){ useCard("garlic"); logm("🧄 Something tried to sabotage you, but your garlic drove it off."); }
      else {
        const opts = ["lights"]; if (S.hand.length) opts.push("steal"); if (ORDER.some(r => S.sleep[r].length)) opts.push("rattle");
        const sab = pick(opts);
        if (sab === "lights"){ S.lights = true; logm("🌑 SABOTAGE! The lights went out. You can only see your own room.", "bad"); }
        if (sab === "steal"){ const k = S.hand.splice(Math.floor(Math.random() * S.hand.length), 1)[0]; logm(`🫳 SABOTAGE! A cold hand snatched your ${ACARDS[k].n} card.`, "bad"); }
        if (sab === "rattle"){ const from = pick(ORDER.filter(r => S.sleep[r].length)), to = pick(ORDER.filter(r => r !== from && r !== "hall")); S.sleep[to].push(S.sleep[from].pop()); logm(`⛓️ SABOTAGE! Chains rattle. A sleeping clue drifted from the ${ROOMS[from].n} to somewhere else.`, "bad"); }
      }
    }
  }
  S.round++; S.moved = false; S.acted = false; S.played = false;
  if (!innocents().length){ return endGame("scared"); }
  if (S.round >= ROUNDS){ return endGame("dawn"); }
  render();
  if (report) meeting(report);
}

/* ---------- emergency meeting (Among Us) ---------- */
let voteFor = null, M = null;
function meeting(report){
  voteFor = null;
  const imp = S.crew.find(c => c.impostor);
  const rooms = ORDER.filter(r => r !== "hall");
  M = {report, lines:active().map(c => {
    let t;
    if (c.impostor){
      const claim = pick(rooms.filter(r => !report || r !== report.room));
      const blame = pick(innocents());
      t = `I was in the ${ROOMS[claim].n} the whole time. ${blame && Math.random() < .5 ? `Honestly? ${blame.name} has been acting sus.` : "Didn't see a thing!"}`;
    } else {
      t = `I was in the ${ROOMS[c.room].n}.`;
      if (report && report.witnesses.includes(c.id)) t += ` I saw ${imp.name} heading toward the ${ROOMS[report.room].n}!`;
      else if (c.caughtSeen) t += "";
      else t += pick([" Creepy… I saw nothing.", " Heard chains rattling, that's all.", " Has anyone checked the cellar?", " I was doing my task!"]);
    }
    return {c, t};
  })};
  showModal(`<h2>🚨 ${report ? `${report.v.name} was found spooked in the ${ROOMS[report.room].n}!` : "Emergency meeting!"}</h2>
    <p class="sub">${report ? `${report.v.name}'s clues scattered into sleeping ghosts in that room.` : "You called the gang together."} Who's the Impostor? Listen, then vote. ${S.crew.some(c => c.caught) ? "⚠️ Remember who you caught lying." : ""}</p>
    <div class="votes">${M.lines.map(l => `<button class="vote" type="button" data-act="voteFor" data-arg="${l.c.id}" aria-pressed="false">${bean(l.c.col, 34)}<span><b style="font-family:var(--cartoon);font-weight:400;font-size:17px">${l.c.name}${l.c.caught ? " ⚠️" : ""}</b><br><span class="claim">"${l.t}"</span></span></button>`).join("")}</div>
    <div class="foot"><button class="pill cream" type="button" data-act="voteFor" data-arg="skip">Skip vote</button><button class="pill red big" type="button" id="castVote" data-act="castVote" disabled>Cast vote</button></div>`, COL.red);
}
function castVote(){
  const imp = S.crew.find(c => c.impostor);
  const tally = {};
  active().forEach(c => {
    let v = "skip";
    if (c.impostor){ v = (pick(innocents().filter(o => o.id !== c.id)) || {}).id ?? "skip"; }
    else if (M.report && M.report.witnesses.includes(c.id)) v = imp.id;
    else if (imp.caught && Math.random() < .7) v = imp.id;
    else if (Math.random() < .35){ const o = pick(active().filter(o => o.id !== c.id)); v = o ? o.id : "skip"; }
    tally[v] = (tally[v] || 0) + 1;
  });
  tally[voteFor] = (tally[voteFor] || 0) + 1;
  let out = voteFor !== "skip" ? voteFor : null;
  if (out == null){ const best = Object.entries(tally).filter(([k]) => k !== "skip").sort((a, b) => b[1] - a[1]); if (best.length && best[0][1] >= 2 && (!best[1] || best[1][1] < best[0][1])) out = +best[0][0]; }
  const tallyText = Object.entries(tally).map(([k, n]) => `${k === "skip" ? "Skip" : S.crew[k].name}: ${n}`).join(" · ");
  let html, msg;
  if (out == null){ msg = "No one was ejected."; html = `<div class="space"><div class="msg">${msg}</div></div>`; logm(`Meeting: no one was ejected. (${tallyText})`); }
  else {
    const c = S.crew[out]; c.status = "ejected";
    S.sleep[c.room].push(...c.cards); c.cards = [];
    msg = c.impostor ? `${c.name} was The Impostor.` : `${c.name} was not The Impostor.`;
    if (c.impostor) S.impOut = true;
    html = `<div class="space"><div class="floater">${bean(c.col, 60)}</div><div class="msg">${msg}</div></div>`;
    logm(`Meeting: ${msg} (${tallyText})${c.cards.length ? "" : " Their clues fell asleep in the " + ROOMS[c.room].n + "."}`, c.impostor ? "" : "bad");
  }
  showModal(`<h2>The votes are in</h2><p class="sub">${tallyText}</p>${html}
    ${out != null && S.crew[out].impostor ? `<p style="font-weight:800;margin-top:12px">No more lies or sabotage! Their clues fell asleep in the ${ROOMS[S.crew[out].room].n}.</p>` : out != null ? `<p style="font-weight:800;margin-top:12px">Their clues fell asleep in the ${ROOMS[S.crew[out].room].n}. The real Impostor is still out there…</p>` : ""}
    <div class="foot"><button class="pill lime" type="button" data-act="close">Back to the case</button></div>`, COL.red);
  if (!innocents().length){ setTimeout(() => endGame("scared"), 3200); }
  render();
}

/* ---------- the unmasking ---------- */
function doAccuse(){
  const guess = {w:pickSel.w, h:pickSel.h, s:pickSel.s};
  const right = guess.w === S.env.w && guess.h === S.env.h && guess.s === S.env.s;
  endGame(right ? "solved" : "wrong", guess);
}
function endGame(how, guess){
  S.over = how; render();
  const env = [S.env.w, S.env.h, S.env.s];
  const best = SUSPECTS.map(s => ({s, n:s.c.filter(k => env.includes(k)).length})).sort((a, b) => b.n - a.n)[0];
  const ben = CARDS[S.env.s];
  const imp = S.crew.find(c => c.impostor);
  const titles = {solved:"Case closed! You unmasked the ghost!", wrong:"Wrong mask! The ghost slips away…", dawn:"Dawn breaks… the ghost escaped.", scared:"The Impostor scared off the whole gang!"};
  const verdict = `<p style="font-size:17px;font-weight:700">The ghost said: make <b>${CARDS[S.env.w].n}</b>, make it by <b>${CARDS[S.env.h].n}</b>, and share it as <b>${CARDS[S.env.s].n}</b>.</p>
    <p style="font-size:17px;font-weight:700">And under the sheet, the class that theory served: <b style="color:${COL.purple}">${ben.ben}</b>.${best.n >= 2 ? ` It wore the face of <b>${best.s.n}</b>.` : ""}</p>`;
  showModal(`<h2>${titles[how]}</h2>
    ${how === "wrong" ? `<p class="sub">You guessed ${[guess.w, guess.h, guess.s].map(cardChip).join(" ")}</p>` : ""}
    <div class="unmask">
      <div class="sheetwrap"><div class="under">${ben.e}</div><div class="sheet">${ghostSvg(150, false)}</div></div>
      <div>${[S.env.w, S.env.h, S.env.s].map(cardChip).join(" ")}${verdict}</div>
    </div>
    <p style="font-weight:800">The Impostor was <span style="color:${imp.col}">${imp.name}</span>${S.impOut ? ", and you voted them out!" : imp.status === "in" ? ", who was never caught." : "."}</p>
    <p class="sub">Hours used: ${Math.min(S.round + 1, ROUNDS)} of ${ROUNDS} · Tasks done: ${S.tasks} · Clues seen: ${Object.keys(S.seen).length} of 12</p>
    <p class="sub">Hunt &amp; Lautzenheiser's point: each pre-Smith theory of value described the economy its authors could see, and served whoever held economic power.</p>
    <div class="foot"><a class="pill cream" href="../">← Case 001 ideas</a><button class="pill lime big" type="button" data-act="newgame">Play again</button></div>`, how === "solved" ? COL.lime : COL.red);
}

/* ---------- title & help ---------- */
function title(){
  showModal(`<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;justify-content:center">${CREW.map(c => bean(c.col, 46)).join("")}${bean(COL.yellow, 52, {hat:true})}</div>
    <h2 style="text-align:center;margin-top:10px">The Haunting of Mercantile Manor</h2>
    <p class="sub" style="text-align:center">England, sometime before 1776. A ghost haunts the manor, hiding behind a theory of profit. Before dawn, work out its answers to the three questions and pull off the mask.</p>
    ${howtoHtml()}
    <div class="foot" style="justify-content:center"><button class="pill lime big" type="button" data-act="newgame">Enter the manor ▶</button></div>`, COL.lime);
}
function howtoHtml(){
  return `<div class="howto">
    <div><b>🔍 The mystery</b>The ghost's disguise is one <b style="display:inline;color:${QC.w};font-family:var(--body);font-weight:800;font-size:15px">WHAT</b>, one <b style="display:inline;color:#167a6e;font-family:var(--body);font-weight:800;font-size:15px">HOW</b>, and one <b style="display:inline;color:#c2306a;font-family:var(--body);font-weight:800;font-size:15px">SHARE</b> card. Make suggestions; crewmates disprove by showing a card. Cross them off in your notebook.</div>
    <div><b>🚨 The Impostor</b>One of your ghost crew is the <b style="display:inline;font-family:var(--body);font-weight:800;font-size:15px">Impostor</b>. They lie when they "can't help," sabotage you, and scare off crewmates out of your sight. A scare triggers a meeting: vote them out!</div>
    <div><b>💤 Sleeping ghosts</b>Some clues are <b style="display:inline;font-family:var(--body);font-weight:800;font-size:15px">sleeping ghosts</b> in rooms. Wake them with KEYs or LANTERNs. Earn cards by doing tasks about the three questions. Traps catch liars; garlic blocks sabotage.</div>
  </div>
  <p class="sub">Each hour: move to a neighboring room, take ONE main action (a task or a suggestion), and play ONE card from your hand. You can see your room and its neighbors. The ghost flees at dawn (8 AM). A wrong unmasking ends the game, so be sure!</p>`;
}

/* ---------- input ---------- */
const ACT = {
  newgame:() => newGame(), help:() => showModal(`<h2>How to play</h2>${howtoHtml()}<div class="foot"><button class="pill lime" type="button" data-act="close">Got it</button></div>`),
  close:() => { hideModal(); render(); },
  move:r => move(r), task:() => task(), answer:(j, el) => answer(j, el),
  suggest:() => picker("suggest"), accuse:() => picker("accuse"), pickC:k => pickC(k),
  doSuggest:() => doSuggest(), doAccuse:() => doAccuse(),
  wake:() => wake(), lantern:() => lanternPick(), lanternRoom:r => wake(r),
  trap:() => trapPick(), trapOn:id => trapOn(+id),
  end:() => endTurn(),
  meeting:() => { if (S.meetingUsed) return; S.meetingUsed = true; meeting(null); render(); },
  voteFor:a => { voteFor = a === "skip" ? "skip" : +a; $$(`[data-act="voteFor"]`).forEach(b => b.setAttribute("aria-pressed", b.dataset.arg === a)); $("#castVote").disabled = false; if (a === "skip") castVote(); },
  castVote:() => castVote(),
  mark:k => { if (S.seen[k]) return; const cyc = [undefined, "x", "q", "star"]; S.marks[k] = cyc[(cyc.indexOf(S.marks[k]) + 1) % cyc.length]; renderNotebook(); }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  if (S && S.over && !["newgame","close","help"].includes(b.dataset.act) && $("#overlay").hidden) return;
  const f = ACT[b.dataset.act]; if (f) f(b.dataset.arg, b);
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches(".room.can")){ e.preventDefault(); e.target.click(); } });

$("#logoBean").innerHTML = bean(COL.yellow, 40, {hat:true});
newGame(); title();
</script>
</body>
