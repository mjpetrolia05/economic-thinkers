<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dream Boutique · Great Economic Thinkers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff2d95; --hot:#e0218a; --bubble:#ffc2e0; --blush:#fff0f7; --cream:#fffafd;
  --lilac:#9b6cff; --aqua:#16b3c4; --sun:#ffd23f; --berry:#5a1040; --muted:#9a4a78; --line:#ffb3d6;
  --script:"Pacifico",cursive; --round:"Fredoka",system-ui,sans-serif; --body:"Quicksand",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0; overflow-x:clip}
body{font-family:var(--body); font-weight:600; font-size:16px; line-height:1.5; color:var(--berry); min-height:100vh;
  background-color:var(--blush);
  background-image:
    repeating-linear-gradient(0deg,rgba(255,45,149,.07) 0 22px,transparent 22px 44px),
    repeating-linear-gradient(90deg,rgba(255,45,149,.07) 0 22px,transparent 22px 44px);
}
a{color:var(--hot)}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0}
button:disabled{cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:3px solid var(--lilac); outline-offset:3px}
h1,h2,h3{margin:0; line-height:1.15}
p{margin:0 0 .7em}
.app{max-width:1100px; margin:0 auto; padding:0 16px 60px}

.spark{position:absolute; color:#fff; text-shadow:0 0 8px var(--pink),0 0 16px #fff; animation:twinkle 2.4s ease-in-out infinite; pointer-events:none}
@keyframes twinkle{0%,100%{opacity:.25; transform:scale(.7)}50%{opacity:1; transform:scale(1.15) rotate(25deg)}}
@keyframes pop{from{opacity:0; transform:translateY(10px) scale(.98)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.mast{position:relative; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:18px 0 10px}
.mast h1{font-family:var(--script); font-weight:400; font-size:clamp(30px,5vw,48px); color:var(--pink); -webkit-text-stroke:2px #fff; paint-order:stroke fill; text-shadow:0 4px 0 var(--hot); transform:rotate(-2deg)}
.mast .k{font-family:var(--round); font-weight:700; font-size:12px; letter-spacing:.1em; color:var(--muted)}
.btns{display:flex; flex-wrap:wrap; gap:8px}
.pill{display:inline-flex; align-items:center; justify-content:center; gap:6px; font-family:var(--round); font-weight:700; font-size:15px; text-decoration:none; color:#fff; padding:10px 18px; border-radius:999px;
  background:linear-gradient(180deg,#ff6ab8,var(--hot)); box-shadow:0 4px 0 #b3166b, inset 0 2px 0 rgba(255,255,255,.55); transition:transform .1s}
.pill:hover:not(:disabled){transform:translateY(-2px)}
.pill:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 #b3166b}
.pill:disabled{opacity:.45}
.pill.light{background:#fff; color:var(--hot); box-shadow:0 4px 0 var(--line), inset 0 0 0 2px var(--line)}
.pill.aqua{background:linear-gradient(180deg,#4fd8e4,var(--aqua)); box-shadow:0 4px 0 #0b7f8b, inset 0 2px 0 rgba(255,255,255,.5)}
.pill.lilac{background:linear-gradient(180deg,#b897ff,var(--lilac)); box-shadow:0 4px 0 #6a3fd0, inset 0 2px 0 rgba(255,255,255,.5)}
.pill.big{font-size:18px; padding:13px 26px}
.pill.sm{font-size:13px; padding:6px 12px}

.hud{position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:10px 14px; margin-bottom:16px; border-radius:999px; background:#fff; box-shadow:inset 0 0 0 3px var(--line), 0 6px 18px -8px rgba(224,33,138,.4)}
.hud .stat{font-family:var(--round); font-weight:700; font-size:15px}
.hud .stat small{font-family:var(--body); color:var(--muted); font-size:12px; margin-right:4px}
.steps{display:flex; gap:6px; margin-left:auto; flex-wrap:wrap}
.step{font-family:var(--round); font-weight:700; font-size:12px; padding:4px 10px; border-radius:999px; background:var(--blush); color:var(--muted)}
.step.on{background:var(--c,var(--pink)); color:#fff}

.card{position:relative; background:var(--cream); border-radius:28px; padding:22px 24px; box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--c,var(--line)), 0 14px 30px -12px rgba(224,33,138,.35); min-width:0}
.enter .card{animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.card + .card{margin-top:20px}
.card h2{font-family:var(--script); font-weight:400; font-size:clamp(26px,4vw,38px); color:var(--c,var(--pink)); margin-bottom:6px}
.card h3{font-family:var(--round); font-weight:700; font-size:19px; color:var(--c,var(--hot)); margin-bottom:6px}
.kicker{display:inline-block; font-family:var(--round); font-weight:700; font-size:12px; letter-spacing:.1em; color:#fff; background:var(--c,var(--pink)); padding:3px 12px; border-radius:999px; margin-bottom:8px}
.note{padding:12px 14px; border-radius:18px; background:#fff; box-shadow:inset 0 0 0 2px var(--line); font-size:15px}
.note + .note{margin-top:8px}
.note.gold{background:#fff3d6; box-shadow:none; border:2px dashed #e6b100}
.muted{color:var(--muted)}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.center{text-align:center}

/* title */
.title{text-align:center; padding:30px 10px}
.title h1{font-family:var(--script); font-weight:400; font-size:clamp(46px,9vw,92px); color:var(--pink); -webkit-text-stroke:3px #fff; paint-order:stroke fill; text-shadow:0 6px 0 var(--hot), 0 10px 22px rgba(224,33,138,.35); transform:rotate(-3deg); margin:8px 0}
.phases{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin:22px 0; text-align:left}
.phase{border-radius:24px; padding:16px; background:#fff; box-shadow:inset 0 0 0 3px var(--c)}
.phase b{display:block; font-family:var(--round); color:var(--c); font-size:17px}
.phase .e{font-size:30px}

/* event banner */
.event{display:flex; gap:14px; align-items:center; padding:14px 18px; border-radius:22px; background:linear-gradient(135deg,#ffe0f0,#fff); box-shadow:inset 0 0 0 3px var(--pink); margin-bottom:14px}
.event .e{font-size:34px}
.event b{font-family:var(--round); font-size:18px; color:var(--hot)}

/* shelf */
.shelf{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.it{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; padding:10px 12px; border-radius:20px; background:#fff; box-shadow:inset 0 0 0 2px var(--line)}
.it .e{font-size:32px; width:44px; text-align:center}
.it .nm{font-family:var(--round); font-weight:700}
.it .px{font-size:13px; color:var(--muted)}
.hearts{font-size:12px; letter-spacing:1px}
.qty{display:flex; align-items:center; gap:6px}
.qty b{font-family:var(--round); font-size:20px; min-width:24px; text-align:center}
.rb{width:34px; height:34px; border-radius:50%; font-family:var(--round); font-weight:700; font-size:20px; color:#fff; background:var(--pink); box-shadow:0 3px 0 #b3166b}
.rb.minus{background:#fff; color:var(--hot); box-shadow:inset 0 0 0 2px var(--line), 0 3px 0 var(--line)}
.rb:disabled{opacity:.35}
.cap{height:16px; border-radius:99px; background:#fff; box-shadow:inset 0 0 0 2px var(--line); overflow:hidden; margin:6px 0 4px}
.cap i{display:block; height:100%; background:linear-gradient(90deg,var(--bubble),var(--pink)); transition:width .3s}

/* shopper */
.shop{display:grid; grid-template-columns:200px minmax(0,1fr); gap:20px; align-items:start}
.doll{border-radius:120px 120px 26px 26px; padding:10px; background:linear-gradient(180deg,var(--c),#fff 75%); box-shadow:0 0 0 4px #fff, 0 0 0 8px var(--c); text-align:center}
.doll svg{width:100%; max-width:150px}
.doll .nm{font-family:var(--script); color:#fff; font-size:22px; text-shadow:0 2px 0 rgba(0,0,0,.15)}
.bubble{position:relative; padding:16px 18px; border-radius:24px; background:#fff; box-shadow:inset 0 0 0 3px var(--c,var(--pink))}
.bubble::before{content:""; position:absolute; left:-12px; top:30px; border:12px solid transparent; border-right-color:var(--c,var(--pink)); border-left:0}
.clue{display:flex; gap:8px; align-items:baseline; font-size:18px; font-weight:700; padding:4px 0; animation:pop .35s}
.clue .tag{flex:none; font-family:var(--round); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#fff; background:var(--c,var(--pink)); padding:2px 8px; border-radius:99px}
.clue.dim{opacity:.35}
.guesses{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:14px}
.g{position:relative; padding:10px 6px; border-radius:18px; background:#fff; box-shadow:inset 0 0 0 2px var(--line), 0 3px 0 var(--line); text-align:center; transition:transform .1s}
.g:hover:not(:disabled){transform:translateY(-2px)}
.g .e{display:block; font-size:30px}
.g .n{font-family:var(--round); font-size:13px}
.g .st{position:absolute; top:4px; right:6px; font-family:var(--round); font-size:11px; background:var(--pink); color:#fff; border-radius:99px; padding:0 6px}
.g .st.zero{background:#ccc}
.g.no{opacity:.4; animation:shake .35s}
.g:disabled{cursor:default}
.res{margin-top:12px; padding:12px 14px; border-radius:18px; font-size:15px; animation:pop .35s}
.res.ok{background:#e9ffe6; box-shadow:inset 0 0 0 2px #4cc76a}
.res.bad{background:#ffe3e8; box-shadow:inset 0 0 0 2px #ff7a99}
.stamp{display:inline-block; border:3px solid currentColor; border-radius:12px; padding:3px 10px; transform:rotate(-6deg); animation:pop .35s}
.flash{color:var(--hot); font-family:var(--round); font-weight:700; margin-top:6px}

/* the split */
.table{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:12px}
.seat{border-radius:22px; padding:12px; background:#fff; box-shadow:inset 0 0 0 3px var(--c); text-align:center}
.seat.turn{background:linear-gradient(180deg,#fff,#ffe9f5); box-shadow:inset 0 0 0 4px var(--c), 0 0 0 4px #fff, 0 0 18px var(--c)}
.seat .who{font-family:var(--round); font-weight:700; font-size:16px; color:var(--c)}
.seat .role{font-size:12px; color:var(--muted)}
.backs{display:flex; justify-content:center; flex-wrap:wrap; gap:3px; margin-top:6px; min-height:30px}
.back{width:20px; height:28px; border-radius:5px; background:repeating-linear-gradient(45deg,var(--pink) 0 4px,#ffc2e0 4px 8px); box-shadow:0 0 0 2px #fff, 0 0 0 3px var(--pink)}
.pile{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:16px; padding:14px; border-radius:22px; background:linear-gradient(135deg,#fff,#ffe9f5); box-shadow:inset 0 0 0 2px var(--line); margin-bottom:12px}
.claimban{font-family:var(--round); font-weight:700; font-size:20px; color:var(--hot)}
.hand{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:10px 0}
.pc{width:78px; height:108px; border-radius:14px; background:#fff; box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--c,var(--pink)), 0 6px 12px -6px rgba(90,16,64,.4); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:4px; transition:transform .15s}
.pc .e{font-size:32px}
.pc .n{font-family:var(--round); font-weight:700; font-size:12px; line-height:1.1; text-align:center}
.pc .s{font-size:10px; color:var(--muted); line-height:1.1; text-align:center}
.pc.sel{transform:translateY(-12px); box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--hot), 0 12px 18px -6px rgba(224,33,138,.6)}
.pc.mini{width:54px; height:72px} .pc.mini .e{font-size:22px} .pc.mini .n{font-size:10px}
.log{list-style:none; margin:0; padding:0; font-size:14px; max-height:170px; overflow:auto}
.log li{padding:6px 10px; border-radius:12px}
.log li:first-child{background:#fff; box-shadow:inset 0 0 0 2px var(--line); font-weight:700}
.shares{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:10px 0}
.share{text-align:center; padding:12px; border-radius:20px; background:#fff; box-shadow:inset 0 0 0 3px var(--c)}
.share b{display:block; font-family:var(--round); font-size:26px; color:var(--c)}
table.sum{width:100%; border-collapse:collapse; font-size:15px}
table.sum td{padding:6px 4px; border-bottom:2px solid #ffe3f1}
table.sum td:last-child{text-align:right; font-family:var(--round); font-weight:700}

.casenav{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:34px}
.cn{display:flex; flex-direction:column; gap:2px; text-decoration:none; padding:14px 20px; border-radius:999px; background:#fff; color:var(--berry); box-shadow:inset 0 0 0 3px var(--line), 0 5px 0 var(--line)}
.cn.next{text-align:right}
.cn .d{font-family:var(--round); font-weight:700; font-size:12px; letter-spacing:.08em; color:var(--muted)}
.cn .t{font-family:var(--script); font-size:22px; color:var(--pink)}
.cn.off{opacity:.45; pointer-events:none}
.foot{text-align:center; color:var(--muted); font-size:13px; margin-top:22px}

@media (max-width:860px){
  .phases{grid-template-columns:1fr}
  .shop{grid-template-columns:1fr}
  .doll{max-width:220px; margin:0 auto}
  .bubble::before{display:none}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:640px){
  .shelf{grid-template-columns:1fr}
  .guesses{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shares{grid-template-columns:1fr}
  .table{gap:6px} .seat{padding:8px 4px} .seat .who{font-size:13px} .seat .role:not(:last-child){display:none} .back{width:12px; height:18px}
  .hud{border-radius:24px}
  .steps{margin-left:0}
  .card{padding:18px}
  .pc{width:66px; height:96px}
  .casenav{grid-template-columns:1fr} .cn{border-radius:26px} .cn.next{text-align:left}
}
@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<div class="app">
  <header class="mast">
    <div>
      <div class="k">💖 CASE 005 · IDEAS IN ACTION</div>
      <h1>The Dream Boutique</h1>
    </div>
    <div class="btns">
      <a class="pill light sm" href="../../">⌂ Home</a>
      <a class="pill light sm" href="../">💖 Case file</a>
      <button class="pill light sm" type="button" data-act="title" id="menuBtn" hidden>☰ Menu</button>
    </div>
  </header>

  <div id="hud"></div>
  <main id="main"></main>

  <nav class="casenav" aria-label="Case files">
    <a class="cn" href="../../ricardo/"><span class="d">◀ PREVIOUS CASE</span><span class="t">Case 004 · Ricardo</span></a>
    <span class="cn next off" aria-disabled="true"><span class="d">NEXT CASE ▶</span><span class="t">Case 006 · Pending</span></span>
  </nav>
  <p class="foot">Ideas from E.K. Hunt &amp; Mark Lautzenheiser, <i>History of Economic Thought</i>, ch. 6. Quotations attributed to Bentham, Say, and Senior are their own words.</p>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const SAVE_KEY = "dream-boutique-v1";
  const DAYS = 6, SHELF = 12, START_CASH = 150;
  const rnd = n => Math.floor(Math.random() * n);
  const pick = a => a[rnd(a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const money = v => "$" + Math.round(v);
  const C = {pink:"#ff2d95", hot:"#e0218a", aqua:"#16b3c4", lilac:"#9b6cff", sun:"#ffd23f", berry:"#5a1040"};

  /* ---------- the catalog: each item scored on Bentham's seven dimensions (0–3) ---------- */
  // d = [intensity, duration, certainty, nearness, fecundity, purity, extent]
  const ITEMS = [
    {id:"lip",   e:"💄", n:"Lipstick",      a:"lipstick",       cost:4,   price:10,  cat:"wear", pop:1.3, d:[1,0,3,3,0,3,0]},
    {id:"bow",   e:"🎀", n:"Hair bow",      a:"a hair bow",     cost:3,   price:8,   cat:"wear", pop:1.3, d:[0,1,3,3,0,3,1]},
    {id:"sun",   e:"🕶️", n:"Sunglasses",    a:"sunglasses",     cost:6,   price:15,  cat:"wear", pop:1.1, d:[1,3,3,3,0,3,0]},
    {id:"heel",  e:"👠", n:"Heels",         a:"heels",          cost:10,  price:24,  cat:"wear", pop:1.0, d:[2,1,2,3,1,1,0]},
    {id:"gown",  e:"👗", n:"Ball gown",     a:"a ball gown",    cost:18,  price:40,  cat:"wear", pop:0.9, d:[3,1,2,2,1,2,2]},
    {id:"skate", e:"🛼", n:"Roller skates", a:"roller skates",  cost:12,  price:28,  cat:"ride", pop:0.9, d:[3,2,1,2,3,0,1]},
    {id:"car",   e:"🚗", n:"Convertible",   a:"a convertible",  cost:60,  price:130, cat:"ride", pop:0.5, d:[3,3,2,1,3,1,3]},
    {id:"house", e:"🏠", n:"Dreamhouse",    a:"a dreamhouse",   cost:120, price:240, cat:"live", pop:0.3, d:[2,3,1,0,3,2,3]}
  ];
  const IT = Object.fromEntries(ITEMS.map(x => [x.id, x]));
  const DIMN = ["intensity","duration","certainty","nearness","fecundity","purity","extent"];
  const HI = ["something THRILLING","something that LASTS","a SURE THING","something I can enjoy RIGHT NOW","something that leads to MORE FUN","pure pleasure, NO PAIN","something my FRIENDS can enjoy too"];
  const LO = ["It's NOT very thrilling.","It DOESN'T last long.","It's NOT a sure thing.","I WON'T get to enjoy it right away.","It DOESN'T lead to more fun.","It's NOT pain-free.","It's JUST for me."];
  const MORE = ["thrilling","lasting","certain","immediate","fun-making","pain-free","shareable"];
  const priceClass = p => p <= 15 ? 0 : p <= 40 ? 1 : 2;

  /* ---------- shopper clues: fixed sentence patterns, filled with Bentham's dimensions ---------- */
  function cluePool(x){
    const P = [];
    P.push({txt:{wear:"You WEAR it.", ride:"You RIDE it.", live:"You LIVE in it."}[x.cat], tag:"kind", f:y => y.cat === x.cat});
    P.push({txt:["It's a LITTLE TREAT.","It's a SPLURGE.","It's a BIG DREAM."][priceClass(x.price)], tag:"price", f:y => priceClass(y.price) === priceClass(x.price)});
    x.d.forEach((v, d) => {
      if (v >= 3) P.push({txt:`I want ${HI[d]}.`, tag:DIMN[d], f:y => y.d[d] >= 3});
      if (v === 0) P.push({txt:LO[d], tag:DIMN[d], f:y => y.d[d] === 0});
    });
    ITEMS.forEach(y => {
      if (y === x || y.cat !== x.cat) return;
      x.d.forEach((v, d) => { if (v > y.d[d]) P.push({txt:`It's like ${y.a} but more ${MORE[d]}.`, tag:DIMN[d], f:z => z !== y && z.cat === y.cat && z.d[d] > y.d[d]}); });
    });
    return P;
  }
  function makeClues(x){
    const P = cluePool(x), cnt = c => ITEMS.filter(c.f).length;
    const set = cs => ITEMS.filter(y => cs.every(c => c.f(y)));
    const good = [];
    (function rec(start, cs){
      if (cs.length >= 2 && set(cs).length === 1){
        const ord = cs.slice().sort((a, b) => cnt(b) - cnt(a));
        if (set(ord.slice(0, -1)).length > 1) good.push(ord);
        return;
      }
      if (cs.length === 4) return;
      for (let i = start; i < P.length; i++) rec(i + 1, cs.concat([P[i]]));
    })(0, []);
    const nice = good.filter(g => g.length >= 3 && cnt(g[0]) >= 3);
    const chosen = pick(nice.length ? nice : good.length ? good : [P.slice(0, 4)]);
    return chosen.map(c => ({txt:c.txt, tag:c.tag}));
  }

  const EVENTS = {
    normal:{e:"☀️", t:"A sunny day in Harmony Land", d:"Six shoppers, each weighing pleasure against pain like a good Benthamite."},
    chest:{e:"🧰", t:"Bentham's chest", d:"Some shoppers are saving instead of spending today: their money is \"put into a chest.\" Two will buy nothing. Say insisted a general glut is impossible. We'll see."},
    wants:{e:"🛍️", t:"Senior's endless wants", d:"\"No person feels his whole wants to be adequately supplied.\" Eight shoppers today."},
    autumn:{e:"🍂", t:"The frightful autumn", d:"Hard times and the new Poor Law. Only five shoppers, and nobody can afford a Big Dream."},
    vent:{e:"✨", t:"A new craze", d:"Everyone suddenly wants ITEM. Three times the usual demand for it today."}
  };
  const NAMES = ["Candi","Juniper","Rosalind","Marisol","Tiff","Dottie","Priya","Gloria","Bea","Lulu","Opal","Wren","Coco","Imani","Daisy","Noor"];
  const HAIR = ["#f5d06b","#7a4b2a","#2e2235","#d9534f","#c9a0dc","#e8e1d9","#ff9ac6"];
  const OUTFIT = [C.pink, C.aqua, C.lilac, "#ff8a3d", "#4cc76a"];

  const CARD = {
    L:{e:"💪", n:"Labor", s:"a day's work", c:C.pink},
    M:{e:"📋", n:"Managing", s:"counts as Labor (Senior)", c:C.pink},
    A:{e:"🐷", n:"Abstinence", s:"saved, not spent", c:C.aqua},
    N:{e:"🌾", n:"Nature's gift", s:"fertile land", c:"#c89800"},
    I:{e:"👑", n:"Inherited", s:"matches nothing", c:C.lilac}
  };
  const RANKS = ["L","A","N"];
  const RN = ["💪 Labor","🐷 Abstinence","🌾 Nature's gift"];
  const PL = [
    {n:"You", role:"the owner · profit", c:C.lilac},
    {n:"Sally", role:"the shopgirl · wages", c:C.pink},
    {n:"Lady Lavender", role:"the landlady · rent", c:"#c89800"}
  ];
  const HANDS = [["A","A","M","I","I","I"], ["L","L","L","L","A","N"], ["N","N","N","N","L","I"]];
  // how suspicious each claim sounds: [claimant][rank]
  const SUSP = [[.15,.03,.35],[.02,.3,.4],[.3,.25,.02]];
  const match = (card, r) => card === r || (card === "M" && r === "L");

  let G = null, timer = null, lastView = "";

  /* ---------- game setup ---------- */
  function newGame(){
    clearTimeout(timer); timer = null;
    const ev = ["normal"].concat(shuffle(["chest","wants","autumn","vent","normal"]));
    G = {
      day:1, cash:START_CASH, phase:"stock", events:ev,
      vent:ev.map(() => pick(["gown","heel","skate","sun"])),
      stock:Object.fromEntries(ITEMS.map(x => [x.id, 0])),
      app:Object.fromEntries(ITEMS.map(x => [x.id, 1])),
      bought:{}, cust:null, today:null, bs:null,
      totals:{profit:0, wages:0, rent:0, absI:0, sold:0, lost:0}
    };
  }
  const shelfCount = () => ITEMS.reduce((s, x) => s + G.stock[x.id], 0);
  const ev = () => G.events[G.day - 1];
  const evText = () => { const e = EVENTS[ev()]; return {e:e.e, t:e.t, d:e.d.replace("ITEM", IT[G.vent[G.day - 1]].n.toLowerCase() + "s")}; };

  /* ---------- WHAT: stocking ---------- */
  function buy(id){
    const x = IT[id];
    if (G.cash < x.cost || shelfCount() >= SHELF) return;
    G.cash -= x.cost; G.stock[id]++; G.bought[id] = (G.bought[id] || 0) + 1;
  }
  function unbuy(id){
    if (!G.bought[id]) return;
    G.cash += IT[id].cost; G.stock[id]--; G.bought[id]--;
  }

  /* ---------- HOW: serving ---------- */
  function openShop(){
    const e = ev(), n = e === "wants" ? 8 : e === "autumn" ? 5 : 6;
    const q = []; for (let i = 0; i < n; i++) q.push(e === "chest" && i < 2);
    G.cust = {queue:shuffle(q), i:-1, cur:null};
    G.today = {made:shelfCount(), sold:0, lost:0, revenue:0, pot:0, hoard:0, buyers:0};
    G.phase = "serve";
    nextCustomer();
  }
  function nextCustomer(){
    const c = G.cust; c.i++;
    if (c.i >= c.queue.length){ c.cur = null; G.phase = "serveEnd"; return; }
    const look = {name:pick(NAMES), hair:pick(HAIR), outfit:pick(OUTFIT)};
    if (c.queue[c.i]){ G.today.hoard++; c.cur = Object.assign({hoard:true}, look); return; }
    const e = ev();
    const w = ITEMS.map(x => {
      let v = x.pop * G.app[x.id];
      if (e === "autumn" && x.price >= 100) v = 0;
      if (e === "vent" && x.id === G.vent[G.day - 1]) v *= 3;
      return v;
    });
    let r = Math.random() * w.reduce((a, b) => a + b, 0), k = 0;
    while (r > w[k] && k < w.length - 1){ r -= w[k]; k++; }
    const item = ITEMS[k];
    G.today.buyers++;
    c.cur = Object.assign({hoard:false, item:item.id, clues:makeClues(item), shown:1, wrong:0, tried:[], result:null, flash:""}, look);
  }
  const SALE_NOTES = [
    "Price, said Say, is \"an index of the recognized utility of a thing.\"",
    "The city's craving for it just dropped: each one gives a little less pleasure than the last.",
    "The wholesale cost comes back to you. The margin goes into tonight's pot.",
    "Bentham would approve: pleasure up, pain down."
  ];
  function guess(id){
    const c = G.cust.cur; if (!c || c.result) return;
    const want = IT[c.item];
    if (id === c.item){
      if (G.stock[id] > 0){
        const tip = [6,4,2,0][Math.min(3, c.shown - 1)];
        G.stock[id]--; G.cash += want.cost;
        G.today.revenue += want.price + tip; G.today.pot += want.price - want.cost + tip; G.today.sold++;
        G.app[id] *= .7;
        c.result = {ok:true, msg:`Sold! ${want.e} ${want.n} for ${money(want.price)}${tip ? ` plus a ${money(tip)} tip` : ""}. ${pick(SALE_NOTES)}`};
      } else {
        G.today.lost++; G.app[id] *= .85;
        c.result = {ok:false, msg:`Right guess, but there's no ${want.n.toLowerCase()} on your shelf. You didn't make it, so nobody could buy it.`};
      }
    } else {
      c.wrong++; c.tried.push(id);
      if (c.wrong >= 2 || c.shown >= c.clues.length){
        G.today.lost++;
        c.result = {ok:false, msg:`"Never mind!" ${c.name} wanted ${want.e} ${want.a}.`};
      } else { c.shown++; c.flash = `"Not ${IT[id].a}!"`; }
    }
  }

  /* ---------- SHARE: the split ---------- */
  function startSplit(){
    G.phase = "split";
    G.bs = {hands:HANDS.map(h => shuffle(h)), pile:[], turn:(G.day - 1) % 3, rank:0, turns:0, claim:null, ask:false, sel:[], log:[], last:null, over:false, result:null, stats:{absI:0, lies:0, slid:0, caught:0}};
    G.bs.log.unshift(`${PL[G.bs.turn].n} ${G.bs.turn === 0 ? "go" : "goes"} first. The first claim is ${RN[0]}.`);
  }
  function play(p, cards){
    const b = G.bs, R = RANKS[b.rank];
    cards.forEach(x => { const i = b.hands[p].indexOf(x); b.hands[p].splice(i, 1); });
    b.pile.push(...cards); b.last = null;
    const lie = cards.some(x => !match(x, R));
    b.claim = {by:p, cards, rank:b.rank, queue:[(p + 1) % 3, (p + 2) % 3], lie, absI:R === "A" ? cards.filter(x => x === "I").length : 0, called:false, truth:true};
    if (p === 0 && lie) b.stats.lies++;
    b.log.unshift(`${PL[p].n} ${p === 0 ? "lay" : "lays"} ${cards.length} card${cards.length > 1 ? "s" : ""} face down: "${cards.length} × ${RN[b.rank]}."`);
  }
  function aiPlay(p){
    const b = G.bs, R = RANKS[b.rank], h = b.hands[p];
    const m = h.filter(x => match(x, R)), non = h.filter(x => !match(x, R));
    let cards = m.slice(0, 3);
    if (!cards.length) cards = [non.includes("I") ? "I" : pick(non)];
    else if (cards.length < 3 && non.length && h.length > cards.length + 1 && Math.random() < .2) cards.push(non.includes("I") ? "I" : non[0]);
    play(p, cards);
  }
  function aiCall(q, c){
    const b = G.bs, R = RANKS[c.rank];
    if (q === 2 && c.by === 0 && R === "A") return Math.random() < .02;   // one owner never doubts another's abstinence
    const held = b.hands[q].filter(x => match(x, R)).length;
    let p = .06 + .12 * (c.cards.length - 1) + .1 * held + SUSP[c.by][c.rank];
    if (b.hands[c.by].length === 0) p += .4;
    return Math.random() < Math.min(.9, p);
  }
  function processCalls(){
    const b = G.bs, c = b.claim;
    while (c.queue.length){
      const q = c.queue[0];
      if (q === 0){ b.ask = true; return; }
      c.queue.shift();
      if (aiCall(q, c)){ reveal(q); return; }
    }
    b.log.unshift(`Nobody asked for proof. ${c.cards.length} card${c.cards.length > 1 ? "s" : ""} accepted as ${RN[c.rank]}.`);
    endTurn();
  }
  function reveal(caller){
    const b = G.bs, c = b.claim, R = RANKS[c.rank];
    const truth = c.cards.every(x => match(x, R));
    const loser = truth ? caller : c.by, n = b.pile.length;
    b.hands[loser].push(...b.pile); b.pile = [];
    c.called = true; c.truth = truth;
    if (c.by === 0 && !truth) b.stats.caught++;
    b.last = {cards:c.cards, truth, caller, by:c.by};
    b.log.unshift(`${PL[caller].n}: "Prove it!" The cards were ${c.cards.map(x => CARD[x].e).join(" ")}. ${truth ? `All true! ${PL[caller].n} ${caller === 0 ? "take" : "takes"} the pile (${n}).` : `Caught bluffing! ${PL[c.by].n} ${c.by === 0 ? "take" : "takes"} the pile (${n}).`}`);
    endTurn();
  }
  function endTurn(){
    const b = G.bs, c = b.claim;
    if (c.by === 0 && !(c.called && !c.truth)){ b.stats.absI += c.absI; if (c.lie) b.stats.slid++; }
    b.claim = null; b.ask = false; b.turns++;
    const w = [0,1,2].find(i => b.hands[i].length === 0);
    if (w !== undefined) return finishSplit(w);
    if (b.turns >= 15) return finishSplit(null);
    b.turn = (b.turn + 1) % 3; b.rank = (b.rank + 1) % 3;
  }
  function finishSplit(w){
    const b = G.bs, pot = G.today.pot;
    const wt = b.hands.map((h, i) => Math.max(1, 9 - h.length) + (i === w ? 3 : 0));
    const sum = wt.reduce((a, c) => a + c, 0);
    const sh = wt.map(v => Math.round(pot * v / sum));
    G.cash += sh[0];
    G.totals.profit += sh[0]; G.totals.wages += sh[1]; G.totals.rent += sh[2]; G.totals.absI += b.stats.absI;
    b.over = true; b.result = {w, sh};
    b.log.unshift(w === null ? "Time's up! The pot is split by how many claims each person got accepted." : `${PL[w].n} ${w === 0 ? "have" : "has"} no cards left! Bonus share.`);
  }
  function nextDay(){
    G.totals.sold += G.today.sold; G.totals.lost += G.today.lost;
    G.day++; G.bought = {}; G.cust = null; G.bs = null;
    ITEMS.forEach(x => G.app[x.id] += (1 - G.app[x.id]) * .4);
    G.phase = G.day > DAYS ? "end" : "stock";
  }

  /* ---------- AI pacing ---------- */
  function schedule(fn, ms){ clearTimeout(timer); timer = setTimeout(() => { timer = null; fn(); render(); }, ms); }
  function advance(){
    if (!G || G.phase !== "split" || timer) return;
    const b = G.bs; if (b.over) return;
    if (b.claim){ if (!b.ask) schedule(processCalls, 900); }
    else if (b.turn !== 0) schedule(() => aiPlay(b.turn), 1000);
  }

  /* ---------- rendering ---------- */
  const doll = (hair, outfit) => `<svg viewBox="0 0 120 170" aria-hidden="true">
    <path d="M30 60 Q22 20 60 14 Q98 20 90 60 Q96 92 86 104 L34 104 Q24 92 30 60Z" fill="${hair}"/>
    <ellipse cx="60" cy="58" rx="24" ry="28" fill="#ffdccb"/>
    <circle cx="51" cy="56" r="3" fill="${C.berry}"/><circle cx="69" cy="56" r="3" fill="${C.berry}"/>
    <ellipse cx="46" cy="66" rx="5" ry="3" fill="#ff9ac6" opacity=".7"/><ellipse cx="74" cy="66" rx="5" ry="3" fill="#ff9ac6" opacity=".7"/>
    <path d="M52 72 Q60 78 68 72" stroke="${C.hot}" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M30 168 L40 98 Q60 88 80 98 L90 168Z" fill="${outfit}"/>
    <path d="M44 98 Q60 112 76 98" stroke="#fff" stroke-width="3" fill="none"/></svg>`;
  const hearts = v => { const n = Math.max(0, Math.min(5, Math.round(v * 5))); return "💗".repeat(n) + "🤍".repeat(5 - n); };
  const card = (x, extra = "", attrs = "") => `<button class="pc ${extra}" type="button" style="--c:${CARD[x].c}" ${attrs}><span class="e">${CARD[x].e}</span><span class="n">${CARD[x].n}</span><span class="s">${CARD[x].s}</span></button>`;

  function hud(){
    if (!G || G.phase === "title" || G.phase === "end"){ $("#hud").innerHTML = ""; return; }
    const ph = G.phase.startsWith("stock") ? 0 : G.phase.startsWith("serve") ? 1 : 2;
    $("#hud").innerHTML = `<div class="hud">
      <span class="stat"><small>DAY</small>${G.day} / ${DAYS}</span>
      <span class="stat"><small>CASH</small>${money(G.cash)}</span>
      <span class="stat"><small>SHELF</small>${shelfCount()} / ${SHELF}</span>
      <div class="steps">
        <span class="step ${ph === 0 ? "on" : ""}" style="--c:${C.pink}">WHAT · Stock</span>
        <span class="step ${ph === 1 ? "on" : ""}" style="--c:${C.aqua}">HOW · Serve</span>
        <span class="step ${ph === 2 ? "on" : ""}" style="--c:${C.lilac}">SHARE · Split</span>
      </div></div>`;
  }

  function vTitle(){
    let has = false; try { has = !!localStorage.getItem(SAVE_KEY); } catch (e) {}
    return `<div class="card title">
      <span class="spark" style="left:8%;top:24px;font-size:24px">✦</span>
      <span class="spark" style="right:9%;top:40px;font-size:28px;animation-delay:.5s">✦</span>
      <span class="kicker">WELCOME TO HARMONY LAND</span>
      <h1>The Dream Boutique</h1>
      <p style="max-width:62ch;margin:0 auto">You've just opened a boutique in the dream world of Bentham, Say, and Senior, where value comes from pleasure and everyone is paid exactly what they deserve. Run the shop for six days and see how harmonious it really is.</p>
      <div class="phases">
        <div class="phase" style="--c:${C.pink}"><span class="e">👗</span><b>1 · WHAT: stock the shelves</b>Buy what gives pleasure. But the city's craving for anything falls each time you sell one.</div>
        <div class="phase" style="--c:${C.aqua}"><span class="e">💬</span><b>2 · HOW: serve the shoppers</b>Shoppers can only describe what they want in Bentham's seven dimensions of pleasure. Guess it in as few clues as you can.</div>
        <div class="phase" style="--c:${C.lilac}"><span class="e">🃏</span><b>3 · SHARE: split the profit</b>You, the shopgirl, and the landlady lay face-down claims of sacrifice. Anyone can demand "Prove it!"</div>
      </div>
      <div class="btns" style="justify-content:center">
        <button class="pill big" type="button" data-act="new">💖 ${has ? "New game" : "Open the boutique"}</button>
        ${has ? `<button class="pill big aqua" type="button" data-act="resume">▶ Continue</button>` : ""}
      </div></div>`;
  }

  function vStock(){
    const e = evText(), full = shelfCount() >= SHELF;
    return `<div class="card">
      <span class="kicker">DAY ${G.day} · WHAT WILL WE MAKE?</span>
      <h2>Stock the shelves</h2>
      <div class="event"><span class="e">${e.e}</span><div><b>Today's forecast: ${e.t}</b><div>${e.d}</div></div></div>
      <div class="grid2" style="margin-bottom:12px">
        <div><div class="muted" style="font-size:14px">Shelf space</div><div class="cap"><i style="width:${shelfCount() / SHELF * 100}%"></i></div><div style="font-size:13px" class="muted">${shelfCount()} of ${SHELF} spots filled. Unsold stock stays on the shelf.</div></div>
        <div class="note" style="font-size:14px">💗 <b>City craving</b> shows how much pleasure the <i>next</i> one would give. Sell lots of one thing and the craving drops (Bentham's diminishing utility). It recovers a little each night.</div>
      </div>
      <div class="shelf">${ITEMS.map(x => `<div class="it">
        <span class="e">${x.e}</span>
        <div><div class="nm">${x.n}</div><div class="px">costs ${money(x.cost)} · sells ${money(x.price)}</div><div class="hearts" title="City craving">${hearts(G.app[x.id])}</div></div>
        <div class="qty"><button class="rb minus" type="button" data-act="unbuy" data-id="${x.id}" ${G.bought[x.id] ? "" : "disabled"} aria-label="Return one ${x.n}">−</button><b>${G.stock[x.id]}</b><button class="rb" type="button" data-act="buy" data-id="${x.id}" ${G.cash < x.cost || full ? "disabled" : ""} aria-label="Buy one ${x.n}">+</button></div>
      </div>`).join("")}</div>
      <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="pill big aqua" type="button" data-act="open">Open the doors ▶</button></div>
    </div>`;
  }

  function vServe(){
    const c = G.cust.cur, n = G.cust.queue.length;
    const head = `<span class="kicker" style="--c:${C.aqua}">DAY ${G.day} · HOW WILL WE MAKE IT? · SHOPPER ${G.cust.i + 1} OF ${n}</span>`;
    const dollBox = `<div class="doll" style="--c:${c.outfit}"><div class="nm">${c.name}</div>${doll(c.hair, c.outfit)}</div>`;
    if (c.hoard) return `<div class="card" style="--c:${C.aqua}">${head}<div class="shop">${dollBox}<div>
      <div class="bubble" style="--c:${C.sun}"><div class="clue">Lovely shop! But I'm not buying today. I'm saving: my money is going into a chest. 🧰</div></div>
      <div class="res bad">Bentham noticed this in 1801: savings can sit idle instead of being spent. Say's law assumes every sale turns straight into another purchase. Today, it doesn't.</div>
      <div class="row" style="margin-top:12px"><button class="pill aqua" type="button" data-act="nextc">Next shopper ▶</button></div></div></div></div>`;
    const done = !!c.result;
    return `<div class="card" style="--c:${C.aqua}">${head}
      <div class="shop">${dollBox}<div>
        <div class="bubble" style="--c:${c.outfit}">
          ${c.clues.map((q, i) => `<div class="clue ${i < c.shown || done ? "" : "dim"}" style="--c:${c.outfit}"><span class="tag">${i < c.shown || done ? q.tag : "?"}</span><span>${i < c.shown || done ? q.txt : "…"}</span></div>`).join("")}
          ${c.flash && !done ? `<div class="flash">${c.flash}</div>` : ""}
        </div>
        ${done ? `<div class="res ${c.result.ok ? "ok" : "bad"}">${c.result.msg}</div><div class="row" style="margin-top:12px"><button class="pill aqua" type="button" data-act="nextc">${G.cust.i + 1 < n ? "Next shopper ▶" : "Close the shop ▶"}</button></div>`
        : `<div class="row" style="margin-top:12px"><button class="pill light sm" type="button" data-act="hint" ${c.shown >= c.clues.length ? "disabled" : ""}>💬 Another clue (smaller tip)</button><span class="muted" style="font-size:13px">Tip if you guess now: ${money([6,4,2,0][Math.min(3, c.shown - 1)])} · ${2 - c.wrong} wrong guess${2 - c.wrong === 1 ? "" : "es"} left</span></div>`}
        <div class="guesses">${ITEMS.map(x => `<button class="g ${c.tried.includes(x.id) ? "no" : ""}" type="button" data-act="guess" data-id="${x.id}" ${done || c.tried.includes(x.id) ? "disabled" : ""}><span class="st ${G.stock[x.id] ? "" : "zero"}">${G.stock[x.id]}</span><span class="e">${x.e}</span><span class="n">${x.n}</span></button>`).join("")}</div>
      </div></div></div>`;
  }

  function vServeEnd(){
    const t = G.today, left = shelfCount(), glut = ev() === "chest";
    return `<div class="card" style="--c:${C.aqua}">
      <span class="kicker" style="--c:${C.aqua}">DAY ${G.day} · CLOSING TIME</span>
      <h2>How did the day go?</h2>
      <table class="sum">
        <tr><td>Items on the shelves this morning</td><td>${t.made}</td></tr>
        <tr><td>Shoppers who came to buy</td><td>${t.buyers}</td></tr>
        <tr><td>Shoppers who hoarded instead</td><td>${t.hoard}</td></tr>
        <tr><td>Sales made</td><td>${t.sold}</td></tr>
        <tr><td>Sales lost (wrong guess or empty shelf)</td><td>${t.lost}</td></tr>
        <tr><td>Profit margin + tips: tonight's pot</td><td>${money(t.pot)}</td></tr>
      </table>
      <div class="note gold" style="margin-top:12px">${glut
        ? `<b>Say's law check:</b> ${t.hoard} shoppers saved instead of spending, so spending fell short of what you'd made. With ${left} items still on your shelf, that's a small <b>general glut</b>. Say called it impossible; Malthus and the later Bentham disagreed.`
        : `<b>Say's law check:</b> ${left} item${left === 1 ? "" : "s"} left unsold. Say would say that's just the wrong mix (too much of one thing, too little of another), and capital will move. Next time, stock what shoppers crave.`}</div>
      <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="pill big lilac" type="button" data-act="tosplit">${t.pot > 0 ? "Split the profit ▶" : "Nothing to split. Next day ▶"}</button></div>
    </div>`;
  }

  function vSplit(){
    const b = G.bs, R = RANKS[b.rank], myTurn = b.turn === 0 && !b.claim && !b.over;
    const seats = PL.map((p, i) => `<div class="seat ${b.turn === i && !b.over ? "turn" : ""}" style="--c:${p.c}">
      <div class="who">${i === 0 ? "🎩 You" : i === 1 ? "💪 Sally" : "🌾 Lady Lavender"}</div><div class="role">${p.role}</div>
      <div class="backs">${b.hands[i].map(() => `<span class="back"></span>`).join("")}</div>
      <div class="role">${b.hands[i].length} card${b.hands[i].length === 1 ? "" : "s"}</div></div>`).join("");
    let center;
    if (b.over){
      const r = b.result;
      center = `<div class="claimban">${r.w === null ? "Time's up!" : `${PL[r.w].n} ${r.w === 0 ? "are" : "is"} out of cards!`}</div>`;
    } else if (b.claim){
      center = `<div><div class="claimban">${PL[b.claim.by].n} claim${b.claim.by === 0 ? "" : "s"}: ${b.claim.cards.length} × ${RN[b.claim.rank]}</div><div class="muted" style="font-size:13px">Pile: ${b.pile.length} card${b.pile.length === 1 ? "" : "s"} face down</div></div>`;
    } else {
      center = `<div><div class="claimban">Next claim: ${RN[b.rank]}</div><div class="muted" style="font-size:13px">Pile: ${b.pile.length} card${b.pile.length === 1 ? "" : "s"} · turn ${b.turns + 1} of 15</div></div>`;
    }
    if (b.last) center += `<div class="row">${b.last.cards.map(x => card(x, "mini", "disabled")).join("")}<span class="stamp" style="font-family:var(--round);font-weight:700;color:${b.last.truth ? "#2e9e4f" : C.hot}">${b.last.truth ? "TRUE ✓" : "BLUFF ✗"}</span></div>`;

    let ctrl = "";
    if (b.over){
      const r = b.result, st = b.stats;
      ctrl = `<div class="shares">${PL.map((p, i) => `<div class="share" style="--c:${p.c}"><span class="muted" style="font-size:13px">${["Your profit","Sally's wages","Lady Lavender's rent"][i]}</span><b>${money(r.sh[i])}</b><span style="font-size:12px" class="muted">${b.hands[i].length} cards left</span></div>`).join("")}</div>
        ${st.absI ? `<div class="note gold">👑 You passed off <b>${st.absI}</b> inherited card${st.absI > 1 ? "s" : ""} as abstinence, and got paid for ${st.absI > 1 ? "them" : "it"}. Senior said profit rewards the painful sacrifice of not spending. The authors point out that most capital is simply inherited.</div>` : ""}
        <div class="note">Say said each factor is paid by its contribution. At this table, pay followed whatever claims nobody could disprove. You bluffed ${st.lies} time${st.lies === 1 ? "" : "s"}; ${st.slid} got through and ${st.caught} ${st.caught === 1 ? "was" : "were"} caught.</div>
        <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="pill big" type="button" data-act="night">${G.day < DAYS ? "Close up for the night ▶" : "See the final books ▶"}</button></div>`;
    } else if (b.ask){
      const held = b.hands[0].filter(x => match(x, RANKS[b.claim.rank])).length;
      ctrl = `<div class="note center">Do you believe ${PL[b.claim.by].n}? You hold ${held} ${RN[b.claim.rank]} card${held === 1 ? "" : "s"} yourself.
        <div class="row" style="justify-content:center;margin-top:10px"><button class="pill" type="button" data-act="call">🚩 Prove it!</button><button class="pill light" type="button" data-act="pass">Let it slide</button></div>
        <div class="muted" style="font-size:12px;margin-top:6px">If they were telling the truth, you take the whole pile.</div></div>`;
    } else if (myTurn){
      ctrl = `<div class="row" style="justify-content:center"><button class="pill lilac" type="button" data-act="claim" ${b.sel.length ? "" : "disabled"}>Lay ${b.sel.length || "…"} face down as ${RN[b.rank]}</button></div>
        <div class="muted center" style="font-size:13px;margin-top:6px">Pick 1–3 cards. They don't have to be ${RN[b.rank]}… if you can keep a straight face.</div>`;
    } else {
      ctrl = `<div class="muted center">${b.claim ? "Waiting to see if anyone asks for proof…" : `${PL[b.turn].n} is choosing cards…`}</div>`;
    }

    return `<div class="card" style="--c:${C.lilac}">
      <span class="kicker" style="--c:${C.lilac}">DAY ${G.day} · HOW WILL WE SHARE IT? · POT ${money(G.today.pot)}</span>
      <h2>The split</h2>
      <p class="muted" style="font-size:14px">Claims go in order: 💪 Labor, 🐷 Abstinence, 🌾 Nature's gift. Lay 1–3 cards face down and say they match the claim. Anyone can say "Prove it!": a bluffer takes the pile, but a wrong accuser takes it instead. When someone runs out of cards (or after 15 turns), the pot is shared by who has the fewest cards left. 📋 <b>Managing</b> counts as Labor; 👑 <b>Inherited</b> matches nothing.</p>
      <div class="table">${seats}</div>
      <div class="pile">${center}</div>
      <div class="hand">${b.hands[0].map((x, i) => card(x, b.sel.includes(i) ? "sel" : "", `data-act="sel" data-i="${i}" ${myTurn ? "" : "disabled"} aria-pressed="${b.sel.includes(i)}"`)).join("")}</div>
      ${ctrl}
      <h3 style="margin-top:14px;font-size:15px">Table talk</h3>
      <ul class="log">${b.log.slice(0, 8).map(l => `<li>${l}</li>`).join("")}</ul>
    </div>`;
  }

  function vEnd(){
    const stockVal = ITEMS.reduce((s, x) => s + G.stock[x.id] * x.cost, 0), worth = G.cash + stockVal, t = G.totals;
    const rating = worth >= 420 ? ["🦄","Harmony Land Tycoon"] : worth >= 260 ? ["👠","Boutique Boss"] : ["🎀","Shopgirl Starter"];
    const tot = Math.max(1, t.profit + t.wages + t.rent), seg = (v, c) => `<div style="flex:${v};background:${c};min-width:${v ? 4 : 0}px"></div>`;
    return `<div class="card center">
      <span class="kicker">THE FINAL BOOKS</span>
      <div style="font-size:60px">${rating[0]}</div>
      <h2>${rating[1]}</h2>
      <p>You started with ${money(START_CASH)} and finished worth <b>${money(worth)}</b> (${money(G.cash)} cash + ${money(stockVal)} of stock at cost).</p>
      <div style="display:flex;height:30px;border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line);margin:14px 0 6px">${seg(t.profit, C.lilac)}${seg(t.wages, C.pink)}${seg(t.rent, "#c89800")}</div>
      <p style="font-size:14px">Profit to you <b>${money(t.profit)}</b> · wages to Sally <b>${money(t.wages)}</b> · rent to Lady Lavender <b>${money(t.rent)}</b> (${Math.round(t.profit / tot * 100)}% / ${Math.round(t.wages / tot * 100)}% / ${Math.round(t.rent / tot * 100)}%)</p>
    </div>
    <div class="card" style="--c:${C.berry}">
      <span class="kicker" style="--c:${C.berry}">⏰ TIME TO WAKE UP</span>
      <div class="note"><b style="color:${C.pink}">What will we make?</b> Whatever gives pleasure, and the next unit always gives less. You sold ${t.sold} items and lost ${t.lost} sales. On the hoarding days, supply did <i>not</i> create its own demand.</div>
      <div class="note"><b style="color:${C.aqua}">How will we make it?</b> Your shoppers could only think in pleasure and pain, like Bentham's calculating individual. Real people also act from habit, love, and custom, which this world left out.</div>
      <div class="note"><b style="color:${C.lilac}">How will we share it?</b> Profit, wages, and rent were set by claims of sacrifice that were hard to check. ${t.absI ? `${t.absI} times, an inheritance passed as "abstinence".` : "You played it honest, but the landlady never questioned an owner's abstinence."} Hunt and Lautzenheiser argue that is exactly how Say and Senior made class conflict disappear.</div>
      <div class="btns" style="justify-content:center;margin-top:14px"><button class="pill big" type="button" data-act="new">💖 Play again</button><a class="pill big light" href="../#verdict">Back to the case file</a></div>
    </div>`;
  }

  function render(){
    $("#menuBtn").hidden = !G || G.phase === "title";
    hud();
    const ph = G ? G.phase : "title";
    const key = ph + (G ? G.day + ":" + (G.cust ? G.cust.i : "") : "");
    $("#main").classList.toggle("enter", key !== lastView); lastView = key;
    $("#main").innerHTML = ph === "title" ? vTitle() : ph === "stock" ? vStock() : ph === "serve" ? vServe() : ph === "serveEnd" ? vServeEnd() : ph === "split" ? vSplit() : vEnd();
    save();
    advance();
  }
  function save(){
    try {
      if (!G || G.phase === "title") return;
      if (G.phase === "end") localStorage.removeItem(SAVE_KEY);
      else localStorage.setItem(SAVE_KEY, JSON.stringify(G));
    } catch (e) {}
  }
  function loadSave(){ try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } }

  /* ---------- input ---------- */
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
    const a = t.dataset.act, id = t.dataset.id;
    const scrollTop = () => window.scrollTo({top:$("#hud").offsetTop - 8});
    switch (a){
      case "title": clearTimeout(timer); timer = null; save(); G = G ? Object.assign({}, G, {_held:G.phase, phase:"title"}) : null; break;
      case "new": newGame(); scrollTop(); break;
      case "resume": { const s = loadSave(); if (s){ G = s; if (G._held){ G.phase = G._held; delete G._held; } } scrollTop(); break; }
      case "buy": buy(id); break;
      case "unbuy": unbuy(id); break;
      case "open": openShop(); scrollTop(); break;
      case "hint": { const c = G.cust.cur; if (c.shown < c.clues.length){ c.shown++; c.flash = ""; } break; }
      case "guess": guess(id); break;
      case "nextc": nextCustomer(); break;
      case "tosplit": if (G.today.pot > 0) startSplit(); else nextDay(); scrollTop(); break;
      case "sel": { const b = G.bs, i = +t.dataset.i, k = b.sel.indexOf(i); if (k >= 0) b.sel.splice(k, 1); else if (b.sel.length < 3) b.sel.push(i); break; }
      case "claim": { const b = G.bs; const cards = b.sel.map(i => b.hands[0][i]); b.sel = []; play(0, cards); break; }
      case "call": { const b = G.bs; b.ask = false; b.claim.queue.shift(); reveal(0); break; }
      case "pass": { const b = G.bs; b.ask = false; b.claim.queue.shift(); processCalls(); break; }
      case "night": nextDay(); scrollTop(); break;
    }
    render();
  });

  // the menu button stores the live phase in _held so "Continue" returns to it
  const s = loadSave();
  G = s ? Object.assign(s, {_held:s._held || s.phase, phase:"title"}) : null;
  render();
})();
</script>
</body>
</html>
